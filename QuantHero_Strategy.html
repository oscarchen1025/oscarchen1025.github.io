<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QuantHero 策略儀表板</title>
<style>
:root {
  --bg: #0a0a0b;
  --sidebar: #0e0e10;
  --card: #121214;
  --card-hi: #18181b;
  --line: rgba(255,255,255,.07);
  --line-strong: rgba(255,255,255,.12);
  --text: #f2f2f4;
  --text2: #a1a1a8;
  --text3: #6b6b72;
  --up: #f0716b;        /* 台股慣例：紅漲 */
  --up-rgb: 240,113,107;
  --down: #35b98b;      /* 綠跌 */
  --down-rgb: 53,185,139;
  --bench: #8e8e95;
  --excess: #6ea8fe;    /* 超額報酬曲線 */
  --good: #35b98b;
  --ok: #c9c9cf;
  --warn: #e8a54b;
  --radius: 22px;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "PingFang TC", "Noto Sans TC", "Helvetica Neue", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--bg); color: var(--text); font-family: var(--font); -webkit-font-smoothing: antialiased; }
body { min-height: 100vh; }
.num { font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.up { color: var(--up); } .down { color: var(--down); } .flat { color: var(--text2); }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }

/* ---------- layout ---------- */
.app { display: grid; grid-template-columns: 440px minmax(0, 1fr); min-height: 100vh; }
.sidebar { background: var(--sidebar); border-right: 1px solid var(--line); position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; }
.main { min-width: 0; padding: 40px 48px 80px; }
.main-inner { max-width: 1060px; margin: 0 auto; }

/* ---------- sidebar ---------- */
.brand { display: flex; align-items: center; gap: 12px; padding: 28px 28px 20px; }
.brand-mark { width: 30px; height: 30px; border-radius: 9px; background: linear-gradient(145deg, #2a2a2e, #161618); border: 1px solid var(--line-strong); display: grid; place-items: center; }
.brand-name { font-size: 17px; font-weight: 600; letter-spacing: -.01em; }
.brand-sub { font-size: 12px; color: var(--text3); margin-top: 2px; }

.select { position: relative; font-size: 14px; color: var(--text2); }
.select select { appearance: none; -webkit-appearance: none; background: transparent; border: 0; color: inherit; font: inherit; padding: 6px 20px 6px 6px; cursor: pointer; outline: none; }
.select select option { background: #1b1b1e; }
.select::after { content: ""; position: absolute; right: 4px; top: 50%; width: 6px; height: 6px; border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor; transform: translateY(-70%) rotate(45deg); pointer-events: none; }
.list { flex: 1; overflow-y: auto; padding: 0 12px; }
.side-title { display: flex; justify-content: space-between; align-items: baseline; padding: 4px 28px 10px; font-size: 12px; color: var(--text3); letter-spacing: .04em; }
.list { flex: 1; overflow-y: auto; padding: 0 16px 16px; display: flex; flex-direction: column; gap: 10px; }
.card-s { display: block; width: 100%; text-align: left; border: 1px solid var(--line); border-radius: 16px; padding: 16px 16px 12px; background: rgba(255,255,255,.015); transition: background .15s, border-color .15s; position: relative; }
.card-s:hover { background: rgba(255,255,255,.03); }
.card-s.active { background: rgba(255,255,255,.055); border-color: var(--line-strong); }
.card-s.active::before { content: ""; position: absolute; left: -1px; top: 18px; bottom: 18px; width: 3px; border-radius: 0 3px 3px 0; background: var(--up); }
.cs-name { font-size: 16px; font-weight: 600; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.capital { margin: 0 28px 14px; padding: 12px 14px; border-radius: 14px; background: rgba(255,255,255,.035); border: 1px solid var(--line); }
.capital-row { display: flex; align-items: center; gap: 10px; }
.capital label { font-size: 13px; color: var(--text2); flex: none; }
.capital-input { flex: 1; display: flex; align-items: center; gap: 6px; background: #0b0b0d; border: 1px solid var(--line-strong); border-radius: 10px; padding: 7px 10px; transition: border-color .15s; }
.capital-input:focus-within { border-color: #6ea8fe; }
.capital-input span { font-size: 13px; color: var(--text3); }
.capital-input input { flex: 1; min-width: 0; background: transparent; border: 0; outline: none; color: var(--text); font: 500 16px var(--font); font-variant-numeric: tabular-nums; text-align: right; }
.capital-chips { display: flex; gap: 6px; margin-top: 10px; }
.capital-chips button { flex: 1; font-size: 12px; padding: 5px 0; border-radius: 8px; color: var(--text2); background: rgba(255,255,255,.05); }
.capital-chips button:hover { background: rgba(255,255,255,.1); color: var(--text); }
.capital-chips button.active { background: rgba(110,168,254,.16); color: #9cc3ff; }
.capital-warn { font-size: 12px; color: var(--warn); margin-top: 8px; line-height: 1.5; }
.drange { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line-strong); border-radius: 10px; padding: 3px 8px; background: #0b0b0d; transition: border-color .15s, background .15s; }
.drange.active { border-color: #6ea8fe; background: rgba(110,168,254,.08); }
.drange input[type=date] { background: transparent; border: 0; color: var(--text2); font: 13px var(--font); font-variant-numeric: tabular-nums; color-scheme: dark; padding: 4px 0; min-width: 0; width: 118px; }
.drange.active input[type=date] { color: var(--text); }
.drange input[type=date]:focus { outline: none; color: var(--text); }
.drange .to { color: var(--text3); font-size: 12px; }
.side-range { padding: 0 28px 14px; }
.side-range-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.side-range-head span { font-size: 12px; color: var(--text3); letter-spacing: .04em; }
.side-range .drange { display: flex; width: 100%; }
.side-range .drange input[type=date] { flex: 1; width: auto; }
.pseg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 3px; background: rgba(255,255,255,.05); border-radius: 10px; padding: 3px; margin-bottom: 8px; }
.pseg button { padding: 6px 0; border-radius: 8px; font-size: 13px; color: var(--text2); transition: background .15s, color .15s; }
.pseg button:hover { color: var(--text); }
.pseg button.active { background: #2a2a2e; color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.4); }
.cs-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.cs-ret { text-align: right; flex: none; }
.cs-ret .v { font-size: 20px; font-weight: 500; line-height: 1.1; }
.cs-ret .l { font-size: 11px; color: var(--text3); margin-top: 3px; }
.range-hint { font-size: 11.5px; color: var(--text3); margin-top: 6px; min-height: 16px; }
.range-hint.err { color: var(--warn); }
.money { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); margin: 22px 40px 0; padding: 14px 18px; border-radius: 14px; background: rgba(0,0,0,.22); border: 1px solid var(--line); }
.money > div { padding: 0 14px; border-left: 1px solid var(--line); min-width: 0; }
.money > div:first-child { padding-left: 0; border-left: 0; }
.money dt { font-size: 12px; color: var(--text3); }
.money dd { font-size: 20px; font-weight: 500; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.money dd small { font-size: 12px; color: var(--text3); font-weight: 400; margin-left: 6px; }
.cs-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; padding: 12px 0 2px; margin-top: 12px; border-top: 1px solid var(--line); }
.cs-stats dt { font-size: 11px; line-height: 16px; height: 16px; color: var(--text3); }
.cs-stats dd { font-size: 15px; margin-top: 3px; }
.side-foot { padding: 16px 28px 20px; font-size: 12px; color: var(--text3); border-top: 1px solid var(--line); line-height: 1.6; }

/* ---------- hero card ---------- */
.hero { position: relative; border-radius: var(--radius); border: 1px solid var(--line); background:
  radial-gradient(120% 70% at 0% 0%, rgba(var(--up-rgb), .16), transparent 60%),
  linear-gradient(180deg, #19141a 0%, var(--card) 45%); padding: 34px 0 26px; overflow: hidden; }
.hero.neg { background: radial-gradient(120% 70% at 0% 0%, rgba(var(--down-rgb), .14), transparent 60%), linear-gradient(180deg, #121916 0%, var(--card) 45%); }
.hero-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; padding: 0 40px; }
.hero-date { font-size: 17px; color: var(--text2); }
.ranges { display: inline-flex; gap: 2px; border: 1px solid var(--line-strong); border-radius: 999px; padding: 3px; }
.ranges button { padding: 6px 13px; border-radius: 999px; font-size: 14px; color: var(--text2); }
.ranges button.active { background: rgba(255,255,255,.1); color: var(--text); }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 22px 40px 0; }
.kpi { padding: 0 24px; border-left: 1px solid var(--line); }
.kpi:first-child { padding-left: 0; border-left: 0; }
.kpi-l { font-size: 14px; color: var(--text2); display: flex; align-items: baseline; gap: 6px; }
.kpi-l small { font-size: 12px; color: var(--text3); }
.kpi-v { font-size: 52px; font-weight: 500; letter-spacing: -.03em; line-height: 1.1; margin-top: 6px; white-space: nowrap; }
.kpi-v .u { font-size: .5em; margin-left: 3px; letter-spacing: 0; }
.kpi-s { font-size: 13px; color: var(--text3); margin-top: 6px; white-space: nowrap; }
.hero-sum { font-size: 15px; color: var(--text2); padding: 22px 40px 0; line-height: 1.5; }
.chart-wrap { position: relative; margin-top: 20px; border-top: 1px solid var(--line); }
.chart-wrap svg { display: block; width: 100%; user-select: none; -webkit-user-select: none; }
.tv-bar { display: flex; justify-content: space-between; align-items: center; gap: 8px 16px; flex-wrap: wrap; padding-top: 12px; }
.tv-legend { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 16px; font-size: 13px; min-height: 22px; }
.tv-toggles { display: flex; gap: 6px; }
.tv-toggles button { font-size: 12.5px; padding: 5px 11px; border-radius: 999px; color: var(--text3); border: 1px solid var(--line); display: inline-flex; align-items: center; gap: 6px; transition: color .15s, border-color .15s, background .15s; }
.tv-toggles button i { width: 8px; height: 8px; border-radius: 2px; opacity: .35; }
.tv-toggles button:hover { color: var(--text2); }
.tv-toggles button.active { color: var(--text); border-color: var(--line-strong); background: rgba(255,255,255,.05); }
.tv-toggles button.active i { opacity: 1; }
.zoom-chip { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; padding: 6px 12px; border-radius: 999px; background: rgba(255,255,255,.1); color: var(--text); }
.zoom-chip[hidden] { display: none; }
.zoom-chip span { color: var(--text3); font-size: 16px; line-height: 1; }
.zoom-chip:hover span { color: var(--text); }
.hero-tools { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
.tv-legend .nm { color: var(--text); font-weight: 500; }
.tv-legend .it { display: inline-flex; align-items: center; gap: 6px; color: var(--text3); }
.tv-legend .it b { font-weight: 500; }
.tv-legend .dt { color: var(--text3); }
.tv-tools { position: absolute; bottom: 4px; display: flex; gap: 2px; }
.tv-tools button { font-size: 12px; padding: 3px 7px; border-radius: 5px; color: var(--text3); }
.tv-tools button:hover { background: rgba(255,255,255,.06); color: var(--text2); }
.tv-tools button.active { color: #5b9cf6; }
.years-wrap { padding: 26px 40px 4px; }
.years-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px; }
.years-head h4 { font-size: 15px; font-weight: 500; }
.years-head span { font-size: 12px; color: var(--text3); }
.years { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); border-radius: 6px 6px 0 0; overflow: hidden; }
.ycell { height: 54px; display: grid; place-items: center; font-size: 15px; font-variant-numeric: tabular-nums; cursor: pointer; transition: box-shadow .12s, opacity .2s; }
.years.zoomed .ycell:not(.sel) { opacity: .4; }
.years.zoomed .ycell:not(.sel):hover { opacity: .8; }
.ycell.sel { box-shadow: inset 0 0 0 2px #fff; }
.ytick.sel { color: var(--text); font-weight: 600; }
.ycell:hover { box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.75); }
.yaxis { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); border-top: 1px solid rgba(255,255,255,.28); }
.ytick { position: relative; text-align: center; font-size: 13px; color: var(--text2); padding-top: 11px; font-variant-numeric: tabular-nums; }
.ytick::before { content: ""; position: absolute; left: 0; top: 0; height: 6px; border-left: 1px solid rgba(255,255,255,.28); }
.ytick:last-child::after { content: ""; position: absolute; right: 0; top: 0; height: 6px; border-left: 1px solid rgba(255,255,255,.28); }
.tip { position: absolute; pointer-events: none; background: rgba(28,28,31,.92); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border: 1px solid var(--line-strong); border-radius: 12px; padding: 10px 12px; font-size: 13px; min-width: 168px; opacity: 0; transition: opacity .12s; box-shadow: 0 8px 30px rgba(0,0,0,.45); z-index: 3; }
.tip.show { opacity: 1; }
.tip .t-date { color: var(--text2); margin-bottom: 6px; }
.tip .row { display: flex; justify-content: space-between; gap: 16px; padding: 2px 0; }
.tip .row span:first-child { color: var(--text2); display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 10px; height: 2px; border-radius: 2px; display: inline-block; }
.sw.dash { border-top: 2px dashed var(--bench); height: 0; background: none; }

/* ---------- sections ---------- */
.section { margin-top: 48px; }
.sec-head { display: flex; justify-content: space-between; align-items: baseline; padding: 0 6px 16px; gap: 12px; }
.sec-title { font-size: 24px; font-weight: 600; letter-spacing: -.01em; }
.sec-meta { font-size: 14px; color: var(--text2); }
.panel { border: 1px solid var(--line); border-radius: var(--radius); background: var(--card); overflow: hidden; }

/* 策略體檢（TradingView Strategy Tester「Performance Summary」風格） */
.tvp { border: 1px solid var(--line); border-radius: 10px; background: var(--card); overflow: hidden; }
.tvp-sum { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); border-bottom: 1px solid var(--line); }
.tvp-cell { padding: 14px 16px 13px; border-left: 1px solid var(--line); min-width: 0; }
.tvp-cell:first-child { border-left: 0; }
.tvp-cell .k { font-size: 12px; color: var(--text3); display: flex; justify-content: space-between; gap: 6px; white-space: nowrap; }
.tvp-cell .v { font-size: 20px; font-weight: 500; margin-top: 5px; white-space: nowrap; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.tvp-cell .v small { font-size: 12px; color: var(--text3); font-weight: 400; margin-left: 4px; }
.tvp-cell .s { font-size: 11.5px; color: var(--text3); margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.st { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; }
.st i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.st.good { color: #26a69a; } .st.ok { color: var(--text2); } .st.warn { color: #f0a03c; }
.tvp-cols { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); }
.tvp-col { border-left: 1px solid var(--line); min-width: 0; }
.tvp-col:first-child { border-left: 0; }
.tvp-col h5 { font-size: 11.5px; font-weight: 500; color: var(--text3); letter-spacing: .04em; padding: 10px 16px 6px; }
.tvp-row { display: flex; justify-content: space-between; gap: 10px; padding: 7px 16px; font-size: 13px; border-top: 1px solid rgba(255,255,255,.04); }
.tvp-row:hover { background: rgba(255,255,255,.025); }
.tvp-row span { color: var(--text2); white-space: nowrap; }
.tvp-row b { font-weight: 500; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tvp-foot { font-size: 11.5px; color: var(--text3); padding: 9px 16px; border-top: 1px solid var(--line); }

/* tables */
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: right; font-weight: 400; color: var(--text3); font-size: 12px; padding: 14px 18px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { text-align: right; padding: 13px 18px; border-bottom: 1px solid var(--line); white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
th:first-child, td:first-child { text-align: left; }
tbody tr:hover td { background: rgba(255,255,255,.02); }
.sym { font-weight: 500; }
.sym small { color: var(--text3); font-weight: 400; margin-left: 8px; font-size: 12px; }
.sym-btn { display: inline-flex; align-items: center; gap: 0; padding: 4px 8px; margin: -4px -8px; border-radius: 8px; transition: background .15s; text-align: left; font-weight: 500; }
.sym-btn:hover { background: rgba(255,255,255,.07); }
.sym-btn svg { margin-left: 8px; color: var(--text3); opacity: 0; transition: opacity .15s; }
.sym-btn:hover svg, .sym-btn:focus-visible svg { opacity: 1; }

/* ---------- 個股快速檢視 ---------- */
.modal { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 16px; background: rgba(0,0,0,.55); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); opacity: 0; pointer-events: none; transition: opacity .18s; }
.modal.open { opacity: 1; pointer-events: auto; }
.modal-card { width: min(760px, 100%); max-height: calc(100vh - 32px); overflow-y: auto; background: #141416; border: 1px solid var(--line-strong); border-radius: 20px; box-shadow: 0 30px 80px rgba(0,0,0,.6); transform: translateY(8px) scale(.985); transition: transform .2s; }
.modal.open .modal-card { transform: none; }
.sk-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; padding: 20px 22px 0; }
.sk-title { font-size: 22px; font-weight: 600; letter-spacing: -.01em; }
.sk-title small { font-size: 15px; font-weight: 400; color: var(--text2); margin-left: 8px; }
.sk-sub { font-size: 13px; color: var(--text3); margin-top: 4px; }
.sk-close { width: 30px; height: 30px; border-radius: 50%; background: rgba(255,255,255,.07); color: var(--text2); font-size: 18px; line-height: 1; flex: none; }
.sk-close:hover { background: rgba(255,255,255,.14); color: var(--text); }
.sk-price { text-align: right; margin-left: auto; }
.sk-price .v { font-size: 22px; font-weight: 500; }
.sk-price .l { font-size: 12px; color: var(--text3); margin-top: 2px; }
.sk-legend { font-size: 12.5px; color: var(--text3); padding: 14px 22px 0; min-height: 32px; display: flex; gap: 12px; flex-wrap: wrap; }
.sk-legend b { font-weight: 500; color: var(--text); }
#skChart { display: block; width: 100%; }
.sk-stats { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; padding: 6px 22px 0; }
.sk-stats div { background: #1a1a1d; border-radius: 10px; padding: 10px 12px; }
.sk-stats dt { font-size: 11px; color: var(--text3); }
.sk-stats dd { font-size: 15px; margin-top: 3px; white-space: nowrap; }
.sk-note { font-size: 12px; color: var(--text3); padding: 12px 22px 18px; line-height: 1.6; }
.table-scroll { overflow-x: auto; }
.bar-cell { display: inline-flex; align-items: center; gap: 10px; justify-content: flex-end; }
.mini-bar { width: 64px; height: 4px; border-radius: 4px; background: rgba(255,255,255,.06); position: relative; overflow: hidden; }
.mini-bar i { position: absolute; top: 0; bottom: 0; border-radius: 4px; }

.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.settings { padding: 20px 22px; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px 20px; }
.settings dt { font-size: 12px; color: var(--text3); }
.settings dd { font-size: 15px; margin-top: 4px; }
.rules { list-style: none; padding: 6px 0; }
.rules li { display: grid; grid-template-columns: 26px 1fr; gap: 10px; padding: 12px 22px; font-size: 15px; line-height: 1.5; border-top: 1px solid var(--line); }
.rules li:first-child { border-top: 0; }
.rules li b { font-weight: 500; color: var(--text3); font-size: 13px; padding-top: 2px; }

@media (max-width: 1100px) {
  .app { grid-template-columns: 360px minmax(0, 1fr); }
  .main { padding: 32px 24px 64px; }
  .grid2 { grid-template-columns: 1fr; }
  .tvp-cols { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .tvp-col:nth-child(3) { border-left: 0; }
  .tvp-col:nth-child(n+3) { border-top: 1px solid var(--line); }
}
@media (max-width: 820px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .capital { margin: 0 16px 12px; } .side-range { padding: 0 16px 12px; }
  .hero-tools { justify-content: flex-start; }
  .money { margin: 18px 22px 0; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 0; }
  .money > div:nth-child(3) { padding-left: 0; border-left: 0; }
 .brand { padding: 22px 16px 16px; } .list { padding: 0 12px 12px; } .side-title { padding: 4px 16px 10px; }
  .sidebar { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--line); }
  .side-foot { display: none; }
  .main { padding: 20px 16px 48px; }
  .hero-head, .kpis, .hero-sum { padding-left: 22px; padding-right: 22px; }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px 0; }

DATA.forEach(s => {
  s.dates = s.timestamps.map(t => new Date(t + 'T00:00:00'));
  // 年度報酬
  const years = {};
  s.timestamps.forEach((t, i) => { const y = +t.slice(0, 4); (years[y] ||= { first: i, last: i }).last = i; });
  s.yearly = Object.entries(years).map(([y, r]) => {
    const base = r.first > 0 ? s.strategy[r.first - 1] : s.strategy[r.first];
    const bBase = r.first > 0 ? s.benchmark[r.first - 1] : s.benchmark[r.first];
    return { year: +y, first: r.first, last: r.last, ret: s.strategy[r.last] / base - 1, bench: s.benchmark[r.last] / bBase - 1 };
  });
});
// 側欄報酬區間：預設 n 日或自訂起訖（對齊到交易日）
function sidePeriod(s) {
  const n = s.strategy.length;
  if (state.custom) {
    const a = idxFrom(s, state.custom.start), b = idxTo(s, state.custom.end);
    if (b <= a) return null;
    const short = t => t.slice(2).replaceAll('-', '/');
    return { a, b, ret: s.strategy[b] / s.strategy[a] - 1, label: `${short(s.timestamps[a])}–${short(s.timestamps[b])}` };
  }
  const p = +state.period, a = Math.max(0, n - 1 - p);
  return { a, b: n - 1, ret: s.strategy[n - 1] / s.strategy[a] - 1, label: `近 ${p} 日` };
}

  return sg + Math.round(a).toLocaleString('en-US') + ' 元';
};

  if (zy) $('#zoomChip').innerHTML = `${zy.year} 年 <span>×</span>`;
  $('#ranges').querySelectorAll('button').forEach(x => x.classList.toggle('active', !zy && !state.heroCustom && +x.dataset.r === state.range));
  $('#heroRange').classList.toggle('active', !!state.heroCustom && !zy);
  $('#heroStart').value = s.timestamps[zy ? Math.max(st, zy.first) : st]; $('#heroEnd').value = s.timestamps[en];

  // KPI：全部期間用 FinLab 回測指標；其他區間由日淨值 / 交易紀錄計算
  const m = s.metrics, full = st === 0 && en === N0 - 1;
  const years = (s.dates[en] - s.dates[st]) / 864e5 / 365.25;
  const rets = S.slice(1).map((v, i) => v / S[i] - 1);
  const mu = rets.reduce((x, y) => x + y, 0) / rets.length;
  const sd = Math.sqrt(rets.reduce((x, y) => x + (y - mu) ** 2, 0) / (rets.length - 1));
  const startMs = s.dates[st].getTime(), endMs = s.dates[en].getTime() + 864e5;
  const closed = s.trades.filter(t => t.exit_date != null && t.entry_date >= startMs && t.exit_date < endMs);
  const cagr = full ? m.profitability.annualReturn : Math.pow(S[S.length - 1], 1 / years) - 1;
  const bCagr = Math.pow(B[B.length - 1], 1 / years) - 1;
  const kMdd = full ? m.risk.maxDrawdown : mdd;
  const sharpe = full ? m.ratio.sharpeRatio : mu / sd * Math.sqrt(252);
  const winRate = full ? m.winrate.winRate : (closed.length ? closed.filter(t => t.return > 0).length / closed.length : null);
  const pctParts = (v, sign) => { const t = fmtPct(v, 1, sign); return `${t.slice(0, -1)}<span class="u">%</span>`; };
  $('#kpis').innerHTML = [
    [zy ? 'Return' : 'CAGR', zy ? '年度報酬' : '年化報酬', `<span class="up">${pctParts(zy ? tot : cagr, false)}</span>`, `大盤 ${fmtPct(zy ? btot : bCagr, 1, false)}`],
    ['MDD', '最大回撤', `<span class="down">${pctParts(kMdd, false)}</span>`, `平均回撤 ${fmtPct(full ? m.risk.avgDrawdown : DD.reduce((x, y) => x + y, 0) / DD.length, 1, false)}`],
    ['Sharpe', '夏普值', sharpe.toFixed(2), full ? `Sortino ${m.ratio.sortinoRatio.toFixed(2)}` : `年化波動 ${fmtPct(sd * Math.sqrt(252), 1, false)}`],
    ['Win Rate', '勝率', winRate == null ? '—' : pctParts(winRate, false), full ? `獲利因子 ${m.ratio.profitFactor.toFixed(2)}` : `${closed.length} 筆已出場交易`],
  ].map(([k, zh, v, sub]) => `<div class="kpi"><div class="kpi-l">${k}<small>${zh}</small></div><div class="kpi-v num">${v}</div><div class="kpi-s num">${sub}</div></div>`).join('');
  // 資金試算：期初投入 capital，依淨值曲線複利
  const cap = state.capital, Eq = S.map(v => v * cap);
  let pk = 0, ddAmt = 0, ddAt = 0; Eq.forEach((v, i) => { pk = Math.max(pk, v); if (v - pk < ddAmt) { ddAmt = v - pk; ddAt = i; } });
  const pnl = Eq[Eq.length - 1] - cap, bPnl = cap * btot;
  $('#money').innerHTML = [
    ['投入資金', fmtMoney(cap), slash(s.timestamps[st])],
    ['期末資產', fmtMoney(Eq[Eq.length - 1]), slash(s.timestamps[en])],
    ['損益', `<span class="${cls(pnl)}">${fmtMoney(pnl, true)}</span>`, `大盤 ${fmtMoney(bPnl, true)}`],
    ['最大帳面虧損', `<span class="down">${fmtMoney(ddAmt, true)}</span>`, ddAmt < 0 ? slash(s.timestamps[st + ddAt]) : ''],
  ].map(([k, v, sub]) => `<div><dt>${k}</dt><dd class="num">${v}<small>${sub}</small></dd></div>`).join('');
  $('#heroSum').textContent = zy
    ? `${zy.year} 年策略 ${fmtPct(tot, 1)}，大盤 ${fmtPct(btot, 1)}，超額 ${fmtPct(tot - btot, 1)}；年內最大回撤 ${(Math.abs(mdd) * 100).toFixed(1)}%。再點一次年度格子或按 × 返回。`
    : `累計報酬 ${fmtPct(tot, 1)}（大盤 ${fmtPct(btot, 1)}），${yv.length} 個年度中 ${winYears} 個賺錢，資產成長 ${S[S.length - 1].toLocaleString('en-US', { maximumFractionDigits: S[S.length - 1] > 100 ? 0 : 1 })} 倍，最慘時從高點跌了 ${(Math.abs(mdd) * 100).toFixed(1)}%。`
  const capy = m.liquidity.capacity;
  if (capy && Math.max(...Eq) > capy) $('#heroSum').textContent += `　⚠ 資金試算為回測複利，未考慮策略容量（約 ${fmtMoney(capy)}）；資產超過容量後實際報酬會明顯下降。`;

  drawChart(s, st, S, B, DD);
  renderYears(yv);
}

function niceLinTicks(mn, mx, cnt = 4) {
  const span = mx - mn, step0 = span / cnt, mag = Math.pow(10, Math.floor(Math.log10(step0)));
  const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(v => v >= step0);
  const out = []; for (let v = Math.ceil(mn / step) * step; v <= mx; v += step) out.push(v); return out;
}

const tipShow = (html, cx, cy) => {
  const tip = $('#tip'), hr = $('#hero').getBoundingClientRect();

  const tw = tip.offsetWidth, th = tip.offsetHeight;
  let left = cx - hr.left - tw / 2; left = Math.max(8, Math.min(left, hr.width - tw - 8));
  tip.style.left = left + 'px'; tip.style.top = (cy - hr.top - th - 12) + 'px';
};

function drawChart(s, st, S, B, DD) {
  const svg = $('#chart'), wrap = $('#chartWrap');
  const W = wrap.clientWidth, mob = W < 600;
  const padL = mob ? 16 : 40, axisW = mob ? 56 : 72;
  const x0 = padL, x1 = W - axisW, cw = x1 - x0;
  const mainTop = 18, mainH = mob ? 230 : 340, ddTop = mainTop + mainH + 30, ddH = mob ? 72 : 92, tTop = ddTop + ddH, H = tTop + 30;
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`); svg.setAttribute('height', H); svg.innerHTML = '';
  $('#tvBar').style.padding = `12px ${axisW}px 0 ${x0}px`;
  $('#tvTools').style.right = '6px';
  const excessC = css('--excess');
  const R = S.map((v, i) => v / B[i]);   // 超額報酬（相對強弱）線
  const up = css('--up'), down = css('--down'), upRgb = css('--up-rgb'), downRgb = css('--down-rgb'), t3 = css('--text3'), t2 = css('--text2');
  const N = S.length, X = i => x0 + i / (N - 1) * cw;
  const AX = 'rgba(255,255,255,.09)', GRID = 'rgba(255,255,255,.045)', LBL = '#2b2b30';

  // ---- y scale (main pane)
  const all = state.excess ? S.concat(B, R) : S.concat(B), mn = Math.min(...all), mx = Math.max(...all);
  const T = state.log ? Math.log10 : (v => v), Ti = state.log ? (v => Math.pow(10, v)) : (v => v);
  const lo = T(mn), hi = T(mx), padY = (hi - lo) * 0.07 || 0.01;
  const Y = v => mainTop + (1 - (T(v) - lo + padY) / (hi - lo + padY * 2)) * mainH;
  const Yinv = y => Ti(lo - padY + (1 - (y - mainTop) / mainH) * (hi - lo + padY * 2));
  const asPct = mx < 11;   // 小於 10 倍時以 % 標示，否則以「倍」標示
  const fmtAxis = v => asPct ? fmtPct(v - 1, Math.abs(v - 1) < 0.1 ? 1 : 0) : (v >= 1000 ? (v / 1000).toLocaleString('en-US', { maximumFractionDigits: v >= 1e4 ? 0 : 1 }) + 'K 倍' : (v >= 10 ? Math.round(v) : v.toFixed(1)) + ' 倍');

  const defs = el('defs', {}, svg);
  const g1 = el('linearGradient', { id: 'areaG', x1: 0, y1: 0, x2: 0, y2: 1 }, defs);
  el('stop', { offset: 0, 'stop-color': `rgb(${upRgb})`, 'stop-opacity': .28 }, g1);
  el('stop', { offset: 1, 'stop-color': `rgb(${upRgb})`, 'stop-opacity': .01 }, g1);
  const g2 = el('linearGradient', { id: 'ddG', x1: 0, y1: 0, x2: 0, y2: 1 }, defs);
  el('stop', { offset: 0, 'stop-color': `rgb(${downRgb})`, 'stop-opacity': .05 }, g2);
  el('stop', { offset: 1, 'stop-color': `rgb(${downRgb})`, 'stop-opacity': .45 }, g2);
  const clip = el('clipPath', { id: 'plotClip' }, defs); el('rect', { x: x0, y: 0, width: cw, height: H }, clip);

  // ---- time axis ticks
  const span = (s.dates[st + N - 1] - s.dates[st]) / 864e5 / 365;
  const ticks = [];
  for (let i = 1; i < N; i++) {
    const a = s.timestamps[st + i - 1], b = s.timestamps[st + i];
    if (span > 2.2 ? a.slice(0, 4) !== b.slice(0, 4) : a.slice(0, 7) !== b.slice(0, 7)) {
      const mo = +b.slice(5, 7);
      ticks.push({ i, label: span > 2.2 || mo === 1 ? b.slice(0, 4) : mo + '月', major: mo === 1 });
    }
  }
  const minGap = mob ? 44 : 60; let lastX = -1e9;
  const tg = el('g', {}, svg);
  ticks.forEach(t => {
    const x = X(t.i); if (x - lastX < minGap || x > x1 - 18) return; lastX = x;
    el('line', { x1: x, x2: x, y1: mainTop - 10, y2: tTop, stroke: GRID }, tg);
    const tx = el('text', { x, y: tTop + 19, fill: t.major ? t2 : t3, 'font-size': 12, 'text-anchor': 'middle', class: 'num' }, tg); tx.textContent = t.label;
  });

  // ---- main pane y grid + right axis labels
  const vmin = Yinv(mainTop + mainH), vmax = Yinv(mainTop);
  let yt = [];
  if (state.log && !asPct) {
    const dec = Math.log10(vmax / vmin), mults = dec < 2.5 ? [1, 2, 5] : [1];
    for (let p = Math.floor(Math.log10(vmin)); p <= Math.ceil(Math.log10(vmax)); p++) mults.forEach(m => yt.push(m * Math.pow(10, p)));
  } else yt = niceLinTicks(vmin - 1, vmax - 1, mob ? 4 : 6).map(v => v + 1);
  yt = yt.filter(v => v >= vmin && v <= vmax);
  const yg = el('g', {}, svg);
  const tagYs = [Y(S[N - 1]), Y(B[N - 1])].concat(state.excess ? [Y(R[N - 1])] : []);
  yt.forEach(v => {
    const y = Y(v); if (y < mainTop + 6 || y > mainTop + mainH - 4) return;
    const nearTag = tagYs.some(ty => Math.abs(ty - y) < 16);
    el('line', { x1: x0, x2: x1, y1: y, y2: y, stroke: GRID }, yg);
    if (nearTag) return;
    const tx = el('text', { x: x1 + 10, y: y + 4, fill: t3, 'font-size': 12, class: 'num' }, yg); tx.textContent = fmtAxis(v);
  });

  // ---- axes frame
  el('line', { x1: x1, x2: x1, y1: 0, y2: tTop, stroke: AX }, svg);
  el('line', { x1: 0, x2: W, y1: tTop, y2: tTop, stroke: AX }, svg);
  el('line', { x1: 0, x2: W, y1: ddTop - 22, y2: ddTop - 22, stroke: AX }, svg);

  // ---- 前 5 大回撤區間（高點 → 回到高點）
  const zones = [];
  for (let i = 1, z = null; i < N; i++) {
    if (DD[i] < 0 && !z) z = { a: i - 1, lo: i };
    if (z) { if (DD[i] < DD[z.lo]) z.lo = i; if (DD[i] === 0 || i === N - 1) { z.b = i; z.rec = DD[i] === 0; z.depth = DD[z.lo]; zones.push(z); z = null; } }
  }
  const topZones = zones.filter(z => z.depth < -0.005).sort((p, q) => p.depth - q.depth).slice(0, 5);
  topZones.forEach((z, k) => z.rank = k + 1);
  const zoneG = el('g', { 'clip-path': 'url(#plotClip)' }, svg);
  if (state.zones) topZones.forEach(z => {
    const xa = X(z.a), xb = X(z.b);
    z.rect = el('rect', { x: xa, y: mainTop, width: Math.max(1, xb - xa), height: tTop - mainTop, fill: `rgba(${downRgb},.075)` }, zoneG);
    el('line', { x1: xa, x2: xa, y1: mainTop, y2: tTop, stroke: `rgba(${downRgb},.35)`, 'stroke-dasharray': '2 3' }, zoneG);
    const lab = el('g', {}, zoneG);
    const txt = xb - xa > 74 ? `#${z.rank}  ${fmtPct(z.depth, 1)}` : `#${z.rank}`;
    const tw = txt.length * 6.6 + 10;
    el('rect', { x: xa + 3, y: mainTop + 2, width: tw, height: 18, rx: 4, fill: `rgba(${downRgb},.18)` }, lab);
    const t = el('text', { x: xa + 8, y: mainTop + 15, fill: down, 'font-size': 11, 'font-weight': 600, class: 'num' }, lab); t.textContent = txt;
  });

  // ---- series
  const path = arr => arr.map((v, i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(v).toFixed(1)).join('');
  const plot = el('g', { 'clip-path': 'url(#plotClip)' }, svg);
  const sLine = path(S);
  el('path', { d: `${sLine}L${X(N - 1)} ${mainTop + mainH}L${X(0)} ${mainTop + mainH}Z`, fill: 'url(#areaG)' }, plot);
  el('path', { d: path(B), fill: 'none', stroke: css('--bench'), 'stroke-width': 1.3, 'stroke-dasharray': '4 3', opacity: .85 }, plot);
  if (state.excess) {
    el('line', { x1: x0, x2: x1, y1: Y(1), y2: Y(1), stroke: excessC, 'stroke-opacity': .25, 'stroke-dasharray': '2 4' }, plot);
    el('path', { d: path(R), fill: 'none', stroke: excessC, 'stroke-width': 1.6, 'stroke-linejoin': 'round' }, plot);
  }
  el('path', { d: sLine, fill: 'none', stroke: up, 'stroke-width': 2, 'stroke-linejoin': 'round' }, plot);

  // ---- last-value price lines + axis tags (TradingView 風格)
  let ys = Y(S[N - 1]), yb = Y(B[N - 1]);
  [[yb, css('--bench')], [ys, up]].forEach(([y, c]) => el('line', { x1: x0, x2: x1, y1: y, y2: y, stroke: c, 'stroke-dasharray': '1 3', opacity: .55 }, svg));
  const tags = [{ y: ys, txt: fmtAxis(S[N - 1]), bg: up, fg: '#1a0a09' }, { y: yb, txt: fmtAxis(B[N - 1]), bg: '#4a4a50', fg: '#f2f2f4' }];
  if (state.excess) { const yr = Y(R[N - 1]); tags.push({ y: yr, txt: fmtAxis(R[N - 1]), bg: excessC, fg: '#06142b' }); el('line', { x1: x0, x2: x1, y1: yr, y2: yr, stroke: excessC, 'stroke-dasharray': '1 3', opacity: .55 }, svg); }
  tags.sort((p, q) => p.y - q.y).forEach((t, k, arr) => { if (k && t.y - arr[k - 1].y < 22) t.y = arr[k - 1].y + 22; });
  const axisTag = (y, txt, bg, fg) => {
    el('rect', { x: x1 + 1, y: y - 10.5, width: axisW - 4, height: 21, rx: 3, fill: bg }, svg);
    const t = el('text', { x: x1 + 8, y: y + 4.5, fill: fg, 'font-size': 12, 'font-weight': 600, class: 'num' }, svg); t.textContent = txt;
  };
  tags.forEach(t => axisTag(t.y, t.txt, t.bg, t.fg));
  if (state.excess) el('circle', { cx: X(N - 1), cy: Y(R[N - 1]), r: 3, fill: excessC }, svg);
  el('circle', { cx: X(N - 1), cy: yb, r: 3, fill: '#d0d0d4' }, svg);
  el('circle', { cx: X(N - 1), cy: ys, r: 8, fill: up, opacity: .18 }, svg);
  el('circle', { cx: X(N - 1), cy: ys, r: 3.5, fill: up }, svg);

  // ---- drawdown pane
  const ddMin = Math.min(...DD) || -0.01, ddLo = ddMin * 1.12;
  const DY = d => ddTop + (d / ddLo) * ddH, DYinv = y => (y - ddTop) / ddH * ddLo;
  niceLinTicks(ddLo, 0, 2).filter(v => v <= 0 && v >= ddLo).forEach(v => {
    const y = DY(v); if (y > tTop - 6) return;
    el('line', { x1: x0, x2: x1, y1: y, y2: y, stroke: GRID }, svg);
    const tx = el('text', { x: x1 + 10, y: y + 4, fill: t3, 'font-size': 12, class: 'num' }, svg); tx.textContent = fmtPct(v, 0, false);
  });
  const ddPath = DD.map((d, i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + DY(d).toFixed(1)).join('');
  el('path', { d: `${ddPath}L${X(N - 1)} ${ddTop}L${X(0)} ${ddTop}Z`, fill: 'url(#ddG)' }, plot);
  el('path', { d: ddPath, fill: 'none', stroke: down, 'stroke-width': 1.1 }, plot);
  const mi = DD.indexOf(ddMin), mxp = X(mi), right = mxp > x1 - 90;
  el('circle', { cx: mxp, cy: DY(ddMin), r: 3, fill: down }, svg);
  const mt = el('text', { x: mxp + (right ? -7 : 7), y: DY(ddMin) + 4, fill: t2, 'font-size': 12, class: 'num', 'text-anchor': right ? 'end' : 'start' }, svg); mt.textContent = fmtPct(ddMin, 1);
  axisTag(DY(DD[N - 1]), fmtPct(DD[N - 1], 1, false), down, '#04140e');
  const ddLeg = el('text', { x: x0 + 2, y: ddTop - 7, 'font-size': 12 }, svg);
  const ddL1 = el('tspan', { fill: t3 }, ddLeg); ddL1.textContent = '回撤  ';
  const ddL2 = el('tspan', { fill: t2, class: 'num' }, ddLeg);
  const ddL3 = el('tspan', { fill: down, class: 'num' }, ddLeg);

  // ---- legend
  const legend = i => {
    $('#tvLegend').innerHTML = `<span class="nm">${s.name}</span><span class="dt num">${slash(s.timestamps[st + i])}</span>
      <span class="it"><i class="sw" style="background:${up}"></i>策略 <b class="num ${cls(S[i] - 1)}">${fmtPct(S[i] - 1, 1)}</b></span>
      <span class="it"><i class="sw dash"></i>大盤 <b class="num" style="color:var(--text)">${fmtPct(B[i] - 1, 1)}</b></span>
      <span class="it">資產 <b class="num" style="color:var(--text)">${fmtMoney(S[i] * state.capital)}</b></span>
      ${state.excess ? `<span class="it"><i class="sw" style="background:${excessC}"></i>超額 <b class="num ${cls(R[i] - 1)}">${fmtPct(R[i] - 1, 1)}</b></span>` : ''}`;
    ddL2.textContent = fmtPct(DD[i], 2);
    const z = state.zones && topZones.find(z => i >= z.a && i <= z.b);
    topZones.forEach(q => q.rect && q.rect.setAttribute('fill', `rgba(${downRgb},${q === z ? .16 : .075})`));
    ddL3.textContent = z ? `   區間 #${z.rank}  ${slash(s.timestamps[st + z.a])} → ${z.rec ? slash(s.timestamps[st + z.b]) : '尚未回到高點'}  ·  最深 ${fmtPct(z.depth, 1)}（${slash(s.timestamps[st + z.lo])}）  ·  ${Math.round((s.dates[st + z.b] - s.dates[st + z.a]) / 864e5)} 天` : '';
  };
  legend(N - 1);

  // ---- crosshair
  const cross = el('g', { 'pointer-events': 'none', opacity: 0 }, svg);
  const dash = { stroke: 'rgba(255,255,255,.4)', 'stroke-width': 1, 'stroke-dasharray': '4 4' };
  const vl = el('line', { ...dash, y1: 0, y2: tTop }, cross), hl = el('line', { ...dash, x1: x0, x2: x1 }, cross);
  const dS = el('circle', { r: 4, fill: up, stroke: '#121214', 'stroke-width': 2 }, cross);
  const dB = el('circle', { r: 3.5, fill: '#d0d0d4', stroke: '#121214', 'stroke-width': 2 }, cross);
  const dD = el('circle', { r: 3, fill: down, stroke: '#121214', 'stroke-width': 1.5 }, cross);
  const dR = el('circle', { r: 3.5, fill: excessC, stroke: '#121214', 'stroke-width': 2, opacity: state.excess ? 1 : 0 }, cross);
  const dateBg = el('rect', { y: tTop + 3, height: 22, rx: 3, fill: LBL }, cross);
  const dateTx = el('text', { y: tTop + 18.5, fill: '#f2f2f4', 'font-size': 12, 'text-anchor': 'middle', class: 'num' }, cross);
  const valBg = el('rect', { x: x1 + 1, width: axisW - 4, height: 21, rx: 3, fill: LBL }, cross);
  const valTx = el('text', { x: x1 + 8, fill: '#f2f2f4', 'font-size': 12, class: 'num' }, cross);
  const hit = el('rect', { x: x0, y: mainTop, width: cw, height: tTop - mainTop, fill: 'transparent', style: 'cursor:crosshair' }, svg);
  const move = ev => {
    const r = svg.getBoundingClientRect(), pt = ev.touches ? ev.touches[0] : ev;
    const px = pt.clientX - r.left, py = Math.max(mainTop, Math.min(tTop - 1, pt.clientY - r.top));
    const i = Math.max(0, Math.min(N - 1, Math.round((px - x0) / cw * (N - 1)))), x = X(i);
    cross.setAttribute('opacity', 1);
    vl.setAttribute('x1', x); vl.setAttribute('x2', x);
    const inDD = py >= ddTop - 22, hy = inDD ? Math.max(ddTop, py) : Math.min(py, mainTop + mainH);
    hl.setAttribute('y1', hy); hl.setAttribute('y2', hy);
    valBg.setAttribute('y', hy - 10.5); valTx.setAttribute('y', hy + 4.5);
    valTx.textContent = inDD ? fmtPct(DYinv(hy), 1, false) : fmtAxis(Yinv(hy));
    dS.setAttribute('cx', x); dS.setAttribute('cy', Y(S[i])); dB.setAttribute('cx', x); dB.setAttribute('cy', Y(B[i]));
    dD.setAttribute('cx', x); dD.setAttribute('cy', DY(DD[i]));
    if (state.excess) { dR.setAttribute('cx', x); dR.setAttribute('cy', Y(R[i])); }
    const d = slash(s.timestamps[st + i]), dw = 84, dx = Math.max(dw / 2, Math.min(x, W - dw / 2));
    dateBg.setAttribute('x', dx - dw / 2); dateBg.setAttribute('width', dw); dateTx.setAttribute('x', dx); dateTx.textContent = d;
    legend(i);
  };
  const leave = () => { cross.setAttribute('opacity', 0); legend(N - 1); };
  hit.addEventListener('mousemove', move); hit.addEventListener('touchmove', move, { passive: true }); hit.addEventListener('touchstart', move, { passive: true });

function openStock(t, srcBtn) {

    const y = Y(v);
    el('line', { x1: x0, x2: x1, y1: y, y2: y, stroke: color, 'stroke-dasharray': dashArr, 'stroke-width': 1.2, opacity: .9 }, svg);
    const lb = el('text', { x: x0 + 4, y: y - 5, fill: color, 'font-size': 11.5, 'font-weight': 500, stroke: '#141416', 'stroke-width': 3, 'paint-order': 'stroke' }, svg); lb.textContent = label;
    tags.push({ y, v, color, fg });
  };
  hline(entryPx, '#e4e4e8', `進場 ${entryPx}`, '5 4');
  if (hasStop) hline(stopPx, down, `停損 ${stopPx.toFixed(2)}（${fmtPct(stopPct, 0)}）`, '2 3');
  const exitPx = t['trade_price@exit_date'];
  if (!isOpen && exitPx != null) hline(exitPx, '#e8a54b', `出場 ${exitPx}`, '5 4');
  // 最新價（與既有價位相同時不重複標示）
  if (!tags.some(g => Math.abs(g.v - last) < 1e-9)) tags.push({ y: Y(last), v: last, color: C[n - 1] >= (C[n - 2] ?? last) ? up : down, fg: '#fff' });
  tags.sort((p, q) => p.y - q.y).forEach((g, k, arr) => { if (k && g.y - arr[k - 1].y < 21) g.y = arr[k - 1].y + 21; });
  tickTexts.forEach(tx => { const y = +tx.getAttribute('y') - 4; if (tags.some(g => Math.abs(g.y - y) < 15)) tx.remove(); });
  tags.forEach(g => {
    el('rect', { x: x1 + 1, y: g.y - 10, width: axisW - 4, height: 20, rx: 3, fill: g.color }, svg);
    const tx = el('text', { x: x1 + 6, y: g.y + 4, fill: g.fg, 'font-size': 11, 'font-weight': 600, class: 'num' }, svg); tx.textContent = g.v.toLocaleString('en-US', { maximumFractionDigits: 2 });
  });
  // 買賣點標記
  const marker = (i, isBuy) => {
    const x = X(i), y = isBuy ? Y(L[i]) + 8 : Y(Hh[i]) - 8, d = isBuy ? `M${x} ${y}l-5 8h10z` : `M${x} ${y}l-5 -8h10z`;
    el('path', { d, fill: isBuy ? up : '#e8a54b' }, svg);
    const tx = el('text', { x, y: isBuy ? y + 21 : y - 12, fill: isBuy ? up : '#e8a54b', 'font-size': 11, 'font-weight': 600, 'text-anchor': 'middle' }, svg); tx.textContent = isBuy ? '買' : '賣';
  };
  if (E >= 0 && E < n) marker(E, true);
  if (Xx >= 0 && Xx < n) marker(Xx, false);
  // 十字線 + OHLC 圖例
  const legend = i => { const pc = i ? C[i] / C[i - 1] - 1 : 0; $('#skLegend').innerHTML = `<span>${slash(D[i])}</span><span>開 <b>${O[i] ?? '—'}</b></span><span>高 <b>${Hh[i] ?? '—'}</b></span><span>低 <b>${L[i] ?? '—'}</b></span><span>收 <b class="${cls(pc)}">${C[i] ?? '—'}</b></span><span class="${cls(pc)}">${fmtPct(pc, 2)}</span>`; };
  legend(n - 1);
  const cross = el('g', { opacity: 0, 'pointer-events': 'none' }, svg);
  const dash = { stroke: 'rgba(255,255,255,.4)', 'stroke-dasharray': '4 4' };
  const vl = el('line', { ...dash, y1: top, y2: tTop }, cross), hl = el('line', { ...dash, x1: x0, x2: x1 }, cross);
  const vb = el('rect', { x: x1 + 1, width: axisW - 4, height: 20, rx: 3, fill: '#2b2b30' }, cross);
  const vt = el('text', { x: x1 + 6, fill: '#f2f2f4', 'font-size': 11, class: 'num' }, cross);
  const hit = el('rect', { x: x0, y: top, width: cw, height: ph, fill: 'transparent', style: 'cursor:crosshair' }, svg);
  const move = ev => {
    const r = svg.getBoundingClientRect(), p = ev.touches ? ev.touches[0] : ev;
    const i = Math.max(0, Math.min(n - 1, Math.floor((p.clientX - r.left - x0) / step))), y = Math.max(top, Math.min(tTop, p.clientY - r.top));
    cross.setAttribute('opacity', 1); vl.setAttribute('x1', X(i)); vl.setAttribute('x2', X(i)); hl.setAttribute('y1', y); hl.setAttribute('y2', y);
    vb.setAttribute('y', y - 10); vt.setAttribute('y', y + 4); vt.textContent = Yinv(y).toFixed(2); legend(i);
  };
  hit.addEventListener('mousemove', move); hit.addEventListener('touchmove', move, { passive: true });
  hit.addEventListener('mouseleave', () => { cross.setAttribute('opacity', 0); legend(n - 1); });
}

function setCapital(v, fromInput) {
  state.capital = Math.max(0, Math.round(v) || 0);
  store.set('dc.capital', String(state.capital));
  if (!fromInput) $('#capitalInput').value = state.capital.toLocaleString('en-US');
  $('#capitalChips').querySelectorAll('button').forEach(b => b.classList.toggle('active', +b.dataset.v === state.capital));
  const capy = DATA[state.idx].metrics.liquidity.capacity, w = $('#capitalWarn');
  w.hidden = !(capy && state.capital > capy);
  if (!w.hidden) w.textContent = `⚠ 超過 ${DATA[state.idx].name} 估計容量 ${fmtMoney(capy)}，實際成交可能有明顯滑價。`;
  renderList(); renderHero(); renderTables(); renderChecks();
}
let capTimer;
$('#capitalInput').addEventListener('input', e => {
  const el2 = e.target, digits = el2.value.replace(/[^\d]/g, '').slice(0, 13);
  el2.value = digits ? (+digits).toLocaleString('en-US') : '';
  clearTimeout(capTimer); capTimer = setTimeout(() => setCapital(+digits, true), 180);
});
$('#capitalInput').addEventListener('blur', () => { $('#capitalInput').value = state.capital.toLocaleString('en-US'); });
$('#capitalInput').addEventListener('keydown', e => { if (e.key === 'Enter') e.target.blur(); });
$('#capitalChips').addEventListener('click', e => { const b = e.target.closest('button'); if (b) setCapital(+b.dataset.v); });

function renderMain() { renderHero(); renderChecks(); renderTables(); }

$('#footDate').textContent = slash(DATA[0].timestamps[DATA[0].timestamps.length - 1]);
renderMain(); setCapital(state.capital); syncSideRange();
let rz; new ResizeObserver(() => { clearTimeout(rz); rz = setTimeout(renderHero, 80); }).observe($('#chartWrap'));

$('#list').addEventListener('click', e => {
  if (!e.target.closest('.card-s') || !matchMedia('(max-width: 820px)').matches) return;
  // 點選後清單會重繪，所以重新抓目前選中的卡片
  const b = $('#list .card-s.active');
  b && b.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
});
</script>
</body>
</html>
