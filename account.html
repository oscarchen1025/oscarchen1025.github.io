<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Holdings Dashboard</title>
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Inter","Noto Sans TC",sans-serif;background:#0d0c11;color:#ebf9ff;font-size:14px;padding:20px;min-height:100vh;display:flex;flex-direction:column;align-items:center;}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 80% 50% at 20% 10%,rgba(100,80,255,0.07) 0%,transparent 60%),radial-gradient(ellipse 60% 40% at 80% 80%,rgba(15,217,166,0.05) 0%,transparent 55%);pointer-events:none;z-index:0;}
.wrap{position:relative;z-index:1;width:900px;max-width:100%;}

/* ── Account Summary ── */
.acct-block{border-radius:14px;background:linear-gradient(160deg,rgba(255,255,255,0.04),#13121a);border:1px solid #252334;box-shadow:0 0 0 0.5px rgba(100,80,255,0.12),0 8px 32px rgba(0,0,0,0.55);padding:16px 22px;margin-bottom:14px;display:inline-flex;align-items:flex-end;gap:12px;}
.acct-cost-lbl{font-size:12px;letter-spacing:0.12em;color:rgba(235,249,255,0.35);text-transform:uppercase;margin-bottom:5px;}
.acct-cost-val{font-size:36px;font-weight:700;letter-spacing:-0.02em;color:#ebf9ff;line-height:1;}
.acct-pnl-inline{display:flex;align-items:center;gap:6px;padding-bottom:3px;}
.acct-metric-lbl{font-size:12px;color:rgba(235,249,255,0.35);}
.acct-metric-val{font-size:13px;font-weight:600;}
.tri-up{display:inline-block;width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent;border-bottom:6px solid #ff627e;}
.tri-down{display:inline-block;width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent;border-top:6px solid #0fd9a6;}

/* ── Toggle（文字 tab + 紫色底線）── */
.toggle-row{display:flex;justify-content:center;margin-top:10px;}
.tsB{display:flex;gap:0;border-bottom:1px solid rgba(255,255,255,0.08);}
.tsB .t-btn{
  position:relative;
  padding:8px 20px 10px;
  border:none;
  background:transparent;
  cursor:pointer;
  font-size:12px;
  font-weight:600;
  letter-spacing:0.04em;
  font-family:"Inter","Noto Sans TC",sans-serif;
  color:rgba(235,249,255,0.38);
  transition:color 0.2s ease;
  white-space:nowrap;
}
.tsB .t-btn::after{
  content:'';
  position:absolute;
  bottom:-1px;
  left:10%;
  right:10%;
  height:2px;
  background:#6566fc;
  border-radius:2px 2px 0 0;
  box-shadow:0 0 8px rgba(101,102,252,0.7);
  opacity:0;
  transform:scaleX(0.6);
  transition:opacity 0.2s ease,transform 0.2s ease;
}
.tsB .t-btn.active{color:#6566fc;}
.tsB .t-btn.active::after{opacity:1;transform:scaleX(1);}
.tsB .t-btn:hover:not(.active){color:rgba(235,249,255,0.62);}

/* ── Viz wrap ── */
.viz-wrap{display:flex;gap:20px;border-radius:16px;background:linear-gradient(160deg,rgba(255,255,255,0.04),#13121a);border:1px solid #252334;box-shadow:0 0 0 0.5px rgba(100,80,255,0.12),0 8px 32px rgba(0,0,0,0.55);padding:20px;margin-bottom:14px;align-items:flex-start;}
.donut-col{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;margin-top:-14px;}
.donut-svg-wrap{position:relative;width:260px;height:260px;}
.donut-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;pointer-events:none;padding:0 22px;text-align:center;}
.donut-center-ticker{font-size:13px;font-weight:700;color:#ebf9ff;letter-spacing:0.01em;line-height:1.3;max-width:136px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;}
.donut-center-name{font-size:11px;font-weight:500;color:rgba(235,249,255,0.60);letter-spacing:0.01em;line-height:1.3;max-width:136px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-all;}
.donut-center-val{font-size:24px;font-weight:700;letter-spacing:-0.01em;line-height:1;margin-top:2px;}
.bar-col{flex:1;display:flex;flex-direction:column;gap:0;min-width:0;justify-content:flex-start;}
.bar-viewport{height:270px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:#3a3850 #1a1828;}
.bar-viewport::-webkit-scrollbar{width:5px;}
.bar-viewport::-webkit-scrollbar-track{background:#1a1828;border-radius:3px;}
.bar-viewport::-webkit-scrollbar-thumb{background:#3a3850;border-radius:3px;}
.h-bar-row{display:grid;grid-template-columns:110px 1fr 70px;align-items:center;column-gap:8px;height:30px;padding:0 4px;border-radius:5px;cursor:default;transition:background 0.12s;}
.h-bar-row:hover{background:rgba(235,249,255,0.05);}
.h-bar-name{font-size:12px;color:rgba(235,249,255,0.70);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:right;}
.h-bar-track{position:relative;height:8px;background:rgba(255,255,255,0.07);border-radius:4px;overflow:hidden;}
.h-bar-fill{position:absolute;top:0;left:0;height:100%;border-radius:4px;transition:width 0.35s ease,background 0.35s ease;}
.h-bar-ret{font-size:12px;font-weight:500;text-align:right;white-space:nowrap;transition:color 0.2s;}

/* ── Table ── */
.table-wrap{border-radius:16px;background:linear-gradient(160deg,rgba(255,255,255,0.04),#13121a);border:1px solid #252334;box-shadow:0 0 0 0.5px rgba(100,80,255,0.12),0 8px 32px rgba(0,0,0,0.55);overflow:hidden;}
.tbl{width:100%;border-collapse:separate;border-spacing:0 3px;padding:12px 16px;}
.tbl thead th{padding:6px 14px 10px;font-size:11px;font-weight:500;color:rgba(235,249,255,0.4);letter-spacing:0.06em;border-bottom:1px solid rgba(255,255,255,0.06);text-align:left;cursor:pointer;user-select:none;white-space:nowrap;transition:color 0.15s;}
.tbl thead th:hover{color:rgba(235,249,255,0.85);}
.tbl thead th.sort-asc .sort-icon::after{content:' ▲';font-size:9px;}
.tbl thead th.sort-desc .sort-icon::after{content:' ▼';font-size:9px;}
.tbl thead th .sort-icon::after{content:' ⇅';font-size:9px;opacity:0.35;}
.tbl thead th.sort-asc,.tbl thead th.sort-desc{color:rgba(235,249,255,0.85);}

/* 資料列 */
.tbl tbody tr{
  background:linear-gradient(180deg,#1e1d26,#13121a);
  border-radius:10px;
  transition:background 0.15s;
  cursor:pointer;
}
/* hover：背景不變色，只改游標 */
.tbl tbody tr:hover{background:linear-gradient(180deg,#1e1d26,#13121a);}

/* active：背景不變，底部顯示紫色線條 */
.tbl tbody tr.row-active{
  background:linear-gradient(180deg,#1e1d26,#13121a) !important;
}
.tbl tbody td{
  padding:10px 14px;
  font-size:13px;
  color:#ebf9ff;
  border-top:1px solid rgba(255,255,255,0.07);
  border-bottom:1px solid rgba(0,0,0,0.4);
  transition:border-bottom-color 0.2s;
}
.tbl tbody td:first-child{border-radius:10px 0 0 10px;border-left:1px solid rgba(255,255,255,0.08);font-weight:600;}
.tbl tbody td:last-child{border-radius:0 10px 10px 0;border-right:1px solid rgba(255,255,255,0.08);}
/* active 列底部紫色線 */
.tbl tbody tr.row-active td{border-bottom-color:#6566fc;}

/* ── Inline K 線展開列 ── */
.kline-inline-row td{
  padding:0 !important;
  border:none !important;
  border-radius:0 !important;
  background:transparent !important;
}
.kline-inline-wrap{
  background:linear-gradient(160deg,#181728,#0f0e1a);
  border:1px solid #2a2840;
  border-radius:14px;
  margin:2px 4px 8px;
  overflow:hidden;
}

/* K 線期間按鈕：同主切換風格 */
.kline-period-row{
  display:flex;gap:0;
  padding:0 18px;
  border-bottom:1px solid rgba(255,255,255,0.06);
}
.kline-period-row .p-btn{
  position:relative;
  background:transparent;
  border:none;
  border-bottom:2px solid transparent;
  color:rgba(235,249,255,0.35);
  padding:8px 14px 9px;
  font-size:11px;font-weight:600;
  cursor:pointer;
  transition:color 0.15s,border-bottom-color 0.15s;
  font-family:"Inter","Noto Sans TC",sans-serif;
  letter-spacing:0.04em;
  margin-bottom:-1px;
}
.kline-period-row .p-btn.active{
  color:#6566fc;
  border-bottom-color:#6566fc;
}
.kline-period-row .p-btn:hover:not(.active){color:rgba(235,249,255,0.65);}

.kline-chart-area{height:280px;position:relative;}
.kline-vol-area{height:70px;position:relative;border-top:1px solid rgba(255,255,255,0.04);}
.kline-no-data{
  display:flex;align-items:center;justify-content:center;
  height:100%;color:rgba(235,249,255,0.3);font-size:13px;
}

/* ── Pagination ── */
.pagination{display:flex;align-items:center;justify-content:center;gap:6px;padding:14px 16px 10px;border-top:1px solid rgba(255,255,255,0.06);}
.pg-btn{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.10);color:rgba(235,249,255,0.65);border-radius:7px;padding:5px 12px;font-size:12px;cursor:pointer;transition:background 0.15s,color 0.15s,border-color 0.15s;font-family:"Inter","Noto Sans TC",sans-serif;}
.pg-btn:hover:not(:disabled){background:rgba(255,255,255,0.10);color:#ebf9ff;border-color:rgba(255,255,255,0.22);}
.pg-btn:disabled{opacity:0.3;cursor:not-allowed;}
.pg-btn.active{background:rgba(101,102,252,0.22);border-color:rgba(101,102,252,0.55);color:#ebf9ff;font-weight:600;}
.pg-info{font-size:11px;color:rgba(235,249,255,0.35);letter-spacing:0.05em;margin:0 6px;}

/* ── Tooltip ── */
#tt{position:fixed;z-index:999;pointer-events:none;display:none;background:rgba(22,21,30,0.96);border:1px solid #2e2b45;border-radius:10px;padding:10px 14px;min-width:170px;box-shadow:0 8px 32px rgba(0,0,0,0.6);font-size:12px;line-height:1.9;}
</style>
</head>

  <!-- Account Summary -->

      <div class="toggle-row">
        <div class="tsB">

        </div>
      </div>
    </div>
    <div class="bar-col">
      <div class="bar-viewport" id="barViewport">
        <div id="barList"></div>
      </div>
    </div>
  </div>

  <div class="table-wrap">
    <table class="tbl" id="posTable"></table>
    <div class="pagination" id="pagination"></div>
  </div>
</div>

<div id="tt"></div>

/* ── K 線專用顏色（只影響 K 棒與成交量）── */
const KLINE_UP_COLOR   = "#ff627e";
const KLINE_DOWN_COLOR = "#0a9981";

/* ── 圓餅圖 / 長條圖 / 表格固定配色（不受 UP/DOWN_COLOR 影響）── */
const CHART_UP_HEX   = '#ff627e';
const CHART_DOWN_HEX = '#0fd9a6';

const GAP=2.8,CX=130,CY=130,R=100,INNER=82;
const totalW = HOLDINGS_DATA.total_weight;
const H      = HOLDINGS_DATA;

let mode = 'ret';
const PAGE_SIZE  = 10;
let currentPage  = 1;
let sortKey      = null;
let sortDir      = 1;
let tableRecords = [...H.records];

/* ── 目前展開的 K 線狀態 ── */
let expandedTicker    = null;
let expandedDays      = 90;
let klineChartInst    = null;
let klineVolChartInst = null;

/* ── helpers ── */
function polar(cx,cy,r,deg){const a=(deg-90)*Math.PI/180;return[cx+r*Math.cos(a),cy+r*Math.sin(a)];}
function arcPath(cx,cy,R,ri,s,e){
  const[x1,y1]=polar(cx,cy,R,s),[x2,y2]=polar(cx,cy,R,e);
  const[x3,y3]=polar(cx,cy,ri,e),[x4,y4]=polar(cx,cy,ri,s);
  const lg=e-s>180?1:0;
  return`M${x1},${y1} A${R},${R} 0 ${lg},1 ${x2},${y2} L${x3},${y3} A${ri},${ri} 0 ${lg},0 ${x4},${y4}Z`;
}

/* 圓餅圖 / 長條圖使用固定配色 */
function retColor(val){
  const maxAbs=mode==='ret'?Math.max(...H.records.map(r=>Math.abs(r.ret)),0.01):10;
  const norm=Math.min(Math.abs(val)/maxAbs,1);
  const a=0.08+0.92*Math.pow(norm,0.6);
  const ah=Math.round(a*255).toString(16).padStart(2,'0');
  return '#'+(val>=0?CHART_UP_HEX.slice(1):CHART_DOWN_HEX.slice(1))+ah;
}
/* 文字 / tooltip 使用固定配色 */
function retHex(v){return v>=0?CHART_UP_HEX:CHART_DOWN_HEX;}
function fmtSign(v,dec=2){return(v>=0?'+':'')+v.toFixed(dec)+'%';}
function getVal(rec){return mode==='ret'?rec.ret:rec.change_rate;}

/* ── Account summary ── */
(function initAcct(){
  const cost=H.cost,pnl=H.total_pnl,ret=H.unrealized_ret;
  document.getElementById('acct-cost-val').textContent='NT$ '+cost.toLocaleString();
  document.getElementById('pnl-tri').className=pnl>=0?'tri-up':'tri-down';

  pnlAbsEl.style.color=retHex(pnl);
  const pnlPctEl=document.getElementById('metric-pnl-pct');
  pnlPctEl.textContent=fmtSign(ret);

})();

/* ── Donut ── */
const cTicker=document.getElementById('cTicker');
const cName  =document.getElementById('cName');
const cVal   =document.getElementById('cVal');
const glowG  =document.getElementById('donutGlowG');
const mainG  =document.getElementById('donutMainG');
const hlG    =document.getElementById('donutHlG');
const svgPaths={};
const barRows={};

function resetCenter(){
  cTicker.textContent='';cTicker.style.display='none';
  if(mode==='ret'){
    cName.textContent='Unrealized return';
    cVal.textContent=fmtSign(H.unrealized_ret);
    cVal.style.color=retHex(H.unrealized_ret);
  }else{
    cName.textContent='Realtime change';
    cVal.textContent=fmtSign(H.realtime_change);
    cVal.style.color=retHex(H.realtime_change);
  }
  cName.style.color='rgba(235,249,255,0.55)';
}
function setCenter(rec){
  cTicker.style.display='block';cTicker.textContent=rec.ticker;
  cName.textContent=rec.name;cName.style.color='rgba(235,249,255,0.70)';
  const v=getVal(rec);
  cVal.textContent=fmtSign(v);cVal.style.color=retHex(v);
}

function buildDonut(){
  glowG.innerHTML='';mainG.innerHTML='';hlG.innerHTML='';
  let angle=-90;
  H.records.forEach(rec=>{
    const sweep=totalW>0?(rec.weight/totalW)*360-GAP:0;
    if(sweep<=0){angle+=totalW>0?(rec.weight/totalW)*360:0;return;}
    const s=angle+GAP/2,e=s+sweep;angle+=sweep+GAP;
    const v=getVal(rec);
    const color=retColor(v);
    const baseHex=v>=0?CHART_UP_HEX:CHART_DOWN_HEX;
    const lg=sweep>180?1:0;
    const glow=document.createElementNS('http://www.w3.org/2000/svg','path');
    glow.setAttribute('d',arcPath(CX,CY,R,INNER,s,e));
    glow.setAttribute('fill',baseHex);glow.setAttribute('opacity','0.18');
    glow.setAttribute('filter','url(#glow)');glow.setAttribute('pointer-events','none');
    glowG.appendChild(glow);
    const main=document.createElementNS('http://www.w3.org/2000/svg','path');
    main.setAttribute('d',arcPath(CX,CY,R,INNER,s,e));
    main.setAttribute('fill',color);main.setAttribute('opacity','0.92');
    main.style.cssText='cursor:pointer;transition:opacity 0.15s,filter 0.15s;';
    main.addEventListener('mouseenter',ev=>{setCenter(rec);main.style.filter='brightness(1.35)';if(barRows[rec.label])barRows[rec.label].style.background='rgba(235,249,255,0.06)';showTt(rec,ev);});
    main.addEventListener('mousemove',ev=>moveTt(ev));
    main.addEventListener('mouseleave',()=>{resetCenter();main.style.filter='';if(barRows[rec.label])barRows[rec.label].style.background='';hideTt();});
    mainG.appendChild(main);
    svgPaths[rec.label]=main;
    const[hx1,hy1]=polar(CX,CY,R,s),[hx2,hy2]=polar(CX,CY,R,e);
    const hl=document.createElementNS('http://www.w3.org/2000/svg','path');
    hl.setAttribute('d',`M${hx1},${hy1} A${R},${R} 0 ${lg},1 ${hx2},${hy2}`);
    hl.setAttribute('fill','none');hl.setAttribute('stroke','rgba(255,255,255,0.28)');
    hl.setAttribute('stroke-width','1.2');hl.setAttribute('pointer-events','none');
    hlG.appendChild(hl);
  });
}

function buildBars(){
  const barListEl=document.getElementById('barList');
  barListEl.innerHTML='';
  Object.keys(barRows).forEach(k=>delete barRows[k]);
  const sortedRecs=mode==='ret'?SORTED_RECORDS:SORTED_RECORDS_CR;
  const maxAbsVal=Math.max(...sortedRecs.map(r=>Math.abs(getVal(r))),0.01);
  sortedRecs.forEach(rec=>{
    const v=getVal(rec);
    const rc=retHex(v),rs=fmtSign(v);
    const fp=(Math.abs(v)/maxAbsVal*100).toFixed(1);
    const row=document.createElement('div');
    row.className='h-bar-row';
    row.innerHTML=`
      <div class="h-bar-name" title="${rec.ticker} ${rec.name}">${rec.ticker} ${rec.name}</div>
      <div class="h-bar-track"><div class="h-bar-fill" style="width:${fp}%;background:${retColor(v)};"></div></div>
      <div class="h-bar-ret" style="color:${rc};">${rs}</div>`;
    row.addEventListener('mouseenter',ev=>{setCenter(rec);if(svgPaths[rec.label])svgPaths[rec.label].style.filter='brightness(1.35)';showTt(rec,ev);});
    row.addEventListener('mousemove',ev=>moveTt(ev));
    row.addEventListener('mouseleave',()=>{resetCenter();if(svgPaths[rec.label])svgPaths[rec.label].style.filter='';hideTt();});
    barListEl.appendChild(row);
    barRows[rec.label]=row;
  });
  document.getElementById('barViewport').style.overflowY=sortedRecs.length<=9?'hidden':'auto';
}

function updateMode(newMode){
  mode=newMode;
  document.getElementById('btnUR').classList.toggle('active',mode==='ret');
  document.getElementById('btnRC').classList.toggle('active',mode==='change_rate');
  buildDonut();buildBars();resetCenter();
}
document.getElementById('btnUR').addEventListener('click',()=>updateMode('ret'));
document.getElementById('btnRC').addEventListener('click',()=>updateMode('change_rate'));

/* ── Table ── */
const cols=[
  {key:'ticker_name',label:'Symbol',          sortable:false},
  {key:'weight',     label:'Weight',          sortable:true},
  {key:'quantity',   label:'Quantity',        sortable:true},
  {key:'price',      label:'Avg cost',        sortable:true},
  {key:'last_price', label:'Price',           sortable:true},
  {key:'change_rate',label:'Change %',        sortable:true},
  {key:'pnl',        label:'PnL',             sortable:true},
  {key:'ret',        label:'Unrealized return',sortable:true},
];

function sortRecords(key){
  sortKey===key?sortDir*=-1:(sortKey=key,sortDir=1);
  tableRecords=[...H.records].sort((a,b)=>{
    const av=a[key]??0,bv=b[key]??0;
    return(av<bv?-1:av>bv?1:0)*sortDir;
  });
  currentPage=1;
  renderTable();renderPagination();
}

function renderThead(){
  const thead=document.createElement('thead');
  const tr=document.createElement('tr');
  cols.forEach(c=>{
    const th=document.createElement('th');
    th.innerHTML=`${c.label}<span class="sort-icon"></span>`;
    if(c.sortable){
      if(sortKey===c.key)th.classList.add(sortDir===1?'sort-asc':'sort-desc');
      th.addEventListener('click',()=>sortRecords(c.key));
    }
    tr.appendChild(th);
  });
  thead.appendChild(tr);
  return thead;
}

    </tr>`;
}

/* ─── K 線圖繪製 ────────────────────────────────────────────────── */
function filterByDays(data,days){
  if(!data||!data.length)return[];
  const cutoff=new Date();
  cutoff.setDate(cutoff.getDate()-days);
  const cutStr=cutoff.toISOString().split('T')[0];
  return data.filter(d=>d.time>=cutStr);
}

function destroyKlineCharts(){
  if(klineChartInst){klineChartInst.remove();klineChartInst=null;}
  if(klineVolChartInst){klineVolChartInst.remove();klineVolChartInst=null;}
}

function drawKlineInto(ticker, days){
  const chartWrap = document.getElementById('kc-'+ticker);
  const volWrap   = document.getElementById('kv-'+ticker);
  if(!chartWrap||!volWrap) return;

  destroyKlineCharts();
  chartWrap.innerHTML='';
  volWrap.innerHTML='';

  const rawData = KLINE_MAP[ticker]||[];
  const data    = filterByDays(rawData, days);

  if(!data.length){
    chartWrap.innerHTML='<div class="kline-no-data">⚠️ 無法取得 K 線資料</div>';
    return;
  }

  /* K 線圖 hover 背景維持透明 */
  const baseOpts={
    layout:{
      background:{color:'transparent'},
      textColor:'rgba(235,249,255,0.5)',
    },
    grid:{
      vertLines:{color:'rgba(255,255,255,0.04)'},
      horzLines:{color:'rgba(255,255,255,0.04)'},
    },
    crosshair:{
      mode:LightweightCharts.CrosshairMode.Normal,
      vertLine:{color:'rgba(255,255,255,0.2)',labelBackgroundColor:'#1e1d26'},
      horzLine:{color:'rgba(255,255,255,0.2)',labelBackgroundColor:'#1e1d26'},
    },
    timeScale:{borderColor:'rgba(255,255,255,0.08)',timeVisible:true,secondsVisible:false},
    rightPriceScale:{borderColor:'rgba(255,255,255,0.08)'},
    handleScrollEvents:true,
    handleScaleEvents:true,
  };

  klineChartInst = LightweightCharts.createChart(chartWrap,{...baseOpts,height:280});

  /* K 棒使用 KLINE_UP_COLOR / KLINE_DOWN_COLOR */
  const candleSeries = klineChartInst.addCandlestickSeries({
    upColor:         KLINE_UP_COLOR,
    downColor:       KLINE_DOWN_COLOR,
    borderUpColor:   KLINE_UP_COLOR,
    borderDownColor: KLINE_DOWN_COLOR,
    wickUpColor:     KLINE_UP_COLOR,
    wickDownColor:   KLINE_DOWN_COLOR,
  });
  candleSeries.setData(data.map(d=>({time:d.time,open:d.open,high:d.high,low:d.low,close:d.close})));

  const rec=H.records.find(r=>r.ticker===ticker);
  if(rec){
    /* 修改：title 設為空字串，只顯示紫色成本線及右側 price axis label */
    candleSeries.createPriceLine({
      price:rec.price,
      color:'#735bf5',
      lineWidth:1,
      lineStyle:LightweightCharts.LineStyle.Dashed,
      axisLabelVisible:true,
      axisLabelColor:'#735bf5',
      axisLabelTextColor:'#ffffff',
      title:'',
    });
  }
  klineChartInst.timeScale().fitContent();

  /* 成交量子圖：同樣使用 KLINE_UP_COLOR / KLINE_DOWN_COLOR */
  klineVolChartInst = LightweightCharts.createChart(volWrap,{
    ...baseOpts,
    height:70,
    timeScale:{...baseOpts.timeScale,visible:false},
    rightPriceScale:{...baseOpts.rightPriceScale,scaleMargins:{top:0.1,bottom:0}},
  });
  const volSeries = klineVolChartInst.addHistogramSeries({priceFormat:{type:'volume'},priceScaleId:''});
  volSeries.setData(data.map(d=>{
    const isUp=d.close>=d.open;
    const hex=isUp?KLINE_UP_COLOR:KLINE_DOWN_COLOR;
    const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
    return {time:d.time,value:d.volume,color:`rgba(${r},${g},${b},0.45)`};
  }));
  klineVolChartInst.timeScale().fitContent();

  klineChartInst.subscribeCrosshairMove(param=>{
    if(param.time&&klineVolChartInst)
      klineVolChartInst.setCrosshairPosition(0,param.time,volSeries);
  });
  klineChartInst.timeScale().subscribeVisibleLogicalRangeChange(range=>{
    if(range&&klineVolChartInst)
      klineVolChartInst.timeScale().setVisibleLogicalRange(range);
  });
}

/* ─── 展開 / 收合 行內 K 線 ─────────────────────────────────────── */
function toggleInlineKline(dataRow, ticker, name){
  const tbody  = dataRow.parentNode;
  const colSpan = cols.length;

  if(expandedTicker === ticker){
    destroyKlineCharts();
    const existRow = tbody.querySelector(`tr[data-kline-row="${ticker}"]`);
    if(existRow) existRow.remove();
    dataRow.classList.remove('row-active');
    expandedTicker = null;
    return;
  }

  if(expandedTicker){
    destroyKlineCharts();
    const prevKlineRow = tbody.querySelector(`tr[data-kline-row="${expandedTicker}"]`);
    if(prevKlineRow) prevKlineRow.remove();
    const prevDataRow = tbody.querySelector(`tr[data-ticker="${expandedTicker}"]`);
    if(prevDataRow) prevDataRow.classList.remove('row-active');
  }

  expandedTicker = ticker;
  expandedDays   = 180;
  dataRow.classList.add('row-active');
  dataRow.insertAdjacentHTML('afterend', makeInlineKlineHTML(colSpan, ticker, name));

  document.querySelectorAll(`#kp-${ticker} .p-btn`).forEach(btn=>{
    btn.addEventListener('click', e=>{
      e.stopPropagation();
      expandedDays = parseInt(btn.dataset.days);
      document.querySelectorAll(`#kp-${ticker} .p-btn`).forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      drawKlineInto(ticker, expandedDays);
    });
  });

  requestAnimationFrame(()=>drawKlineInto(ticker, expandedDays));
}

/* ─── 渲染表格 tbody ────────────────────────────────────────────── */
function renderTbody(){
  const start=(currentPage-1)*PAGE_SIZE;
  const pageRecs=tableRecords.slice(start,start+PAGE_SIZE);
  const tbody=document.createElement('tbody');

  pageRecs.forEach(r=>{
    const tr=document.createElement('tr');
    tr.dataset.ticker = r.ticker;
    tr.innerHTML=`
      <td>
        <span style="font-weight:700;">${r.ticker}</span><br>
        <span style="font-size:11px;color:#a0aab8;font-weight:400;">${r.name}</span>
      </td>
      <td>${r.weight.toFixed(1)}%</td>
      <td>${r.quantity.toLocaleString()}</td>
      <td style="color:rgba(235,249,255,0.55);">${r.price.toFixed(2)}</td>
      <td>${r.last_price.toFixed(2)}</td>
      <td style="color:${retHex(r.change_rate)}">${fmtSign(r.change_rate)}</td>
      <td style="color:${retHex(r.pnl)}">${(r.pnl>=0?'+':'')+r.pnl.toLocaleString()}</td>
      <td style="color:${retHex(r.ret)};font-weight:600;">${fmtSign(r.ret)}</td>`;

    tr.addEventListener('click', ()=>toggleInlineKline(tr, r.ticker, r.name));
    tbody.appendChild(tr);
  });

  return tbody;
}

function renderTable(){
  destroyKlineCharts();
  expandedTicker = null;

  const tbl=document.getElementById('posTable');
  tbl.innerHTML='';
  tbl.appendChild(renderThead());
  tbl.appendChild(renderTbody());
}

function renderPagination(){
  const pg=document.getElementById('pagination');
  pg.innerHTML='';
  const total=tableRecords.length;
  if(total<=PAGE_SIZE){pg.style.display='none';return;}
  pg.style.display='flex';
  const totalPages=Math.ceil(total/PAGE_SIZE);
  const prev=document.createElement('button');
  prev.className='pg-btn';prev.textContent='‹';prev.disabled=currentPage===1;
  prev.addEventListener('click',()=>{currentPage--;renderTable();renderPagination();});
  pg.appendChild(prev);
  const range=getPgRange(currentPage,totalPages);
  let lastPg=0;
  range.forEach(p=>{
    if(p-lastPg>1){const el=document.createElement('span');el.className='pg-info';el.textContent='…';pg.appendChild(el);}
    const btn=document.createElement('button');
    btn.className='pg-btn'+(p===currentPage?' active':'');
    btn.textContent=p;
    btn.addEventListener('click',()=>{currentPage=p;renderTable();renderPagination();});
    pg.appendChild(btn);
    lastPg=p;
  });
  const next=document.createElement('button');
  next.className='pg-btn';next.textContent='›';next.disabled=currentPage===totalPages;
  next.addEventListener('click',()=>{currentPage++;renderTable();renderPagination();});
  pg.appendChild(next);
  const info=document.createElement('span');
  info.className='pg-info';
  const s=(currentPage-1)*PAGE_SIZE+1,e=Math.min(currentPage*PAGE_SIZE,total);
  info.textContent=`${s}–${e} / ${total}`;
  pg.appendChild(info);
}

function getPgRange(cur,total){
  if(total<=7)return Array.from({length:total},(_,i)=>i+1);
  const s=new Set([1,total,cur]);
  if(cur>1)s.add(cur-1);
  if(cur<total)s.add(cur+1);
  return[...s].sort((a,b)=>a-b);
}

/* ── Initial render ── */
buildDonut();buildBars();resetCenter();
renderTable();renderPagination();

/* ── Tooltip ── */
const tt=document.getElementById('tt');
function showTt(r,e){
  const rc=retHex(r.ret),pc=retHex(r.pnl),cc=retHex(r.change_rate);
  tt.innerHTML=`
    <div style="font-weight:700;font-size:13px;">${r.ticker}</div>
    <div style="color:#a0aab8;font-weight:500;font-size:12px;margin-bottom:6px;">${r.name}</div>
    <div>Weight: <b>${r.weight.toFixed(2)}%</b></div>
    <div>Return: <b style="color:${rc}">${fmtSign(r.ret)}</b></div>
    <div>PnL: <b style="color:${pc}">${(r.pnl>=0?'+':'')+r.pnl.toLocaleString()}</b></div>
    <div>Change: <b style="color:${cc}">${fmtSign(r.change_rate)}</b></div>`;
  tt.style.display='block';moveTt(e);
}
function moveTt(e){
  const tw=tt.offsetWidth||170,th=tt.offsetHeight||100;
  let x=e.clientX+14,y=e.clientY-10;
  if(x+tw>window.innerWidth-8)x=e.clientX-tw-10;
  if(y+th>window.innerHeight-8)y=window.innerHeight-th-8;
  tt.style.left=x+'px';tt.style.top=y+'px';
}
function hideTt(){tt.style.display='none';}
</script>
