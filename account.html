<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0">
<title>Account</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:"PingFang SC", "SF Pro Display", -apple-system, "Helvetica Neue", sans-serif;
  background:#0a0e13;
  color:#ebf9ff;
  font-size:14px;
  font-weight:400;
  padding:30px;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
}
body::before{
  content:'';
  position:fixed;
  inset:0;
  background:
    radial-gradient(ellipse 80% 50% at 20% 10%,rgba(100,80,255,0.07) 0%,transparent 60%),
    radial-gradient(ellipse 60% 40% at 80% 80%,rgba(15,217,166,0.05) 0%,transparent 55%);
  pointer-events:none;
  z-index:0;
}
.wrap{position:relative;z-index:1;width:900px;max-width:100%;}

/* ── Fund Usage Bar (above donut + bar chart) ── */
.fund-usage-card{
  border-radius:16px;
  background:#0a0e13;
  border:1px solid rgba(255,255,255,0.06);
  padding:18px 20px;
  margin-bottom:14px;
}
.fu-value{font-size:26px;font-weight:700;letter-spacing:-0.01em;margin-top:10px;color:#ebf9ff;}
.fu-value .fu-sep{color:#848a94;font-weight:400;}
.fu-value .fu-total{color:#848a94;font-weight:700;}
.fu-track{position:relative;height:10px;border-radius:5px;background:rgba(255,255,255,0.07);margin-top:16px;cursor:pointer;}
.fu-fill{position:absolute;top:0;left:0;height:100%;border-radius:5px 0 0 5px;transition:width 0.4s ease,background 0.4s ease;}
.fu-hatch{position:absolute;top:0;height:100%;border-radius:0 5px 5px 0;transition:left 0.4s ease,width 0.4s ease,background 0.4s ease;}
.fu-handle{position:absolute;top:50%;width:16px;height:16px;border-radius:50%;background:#0a0e13;border:3px solid #00d4a9;transform:translate(-50%,-50%);transition:left 0.4s ease,border-color 0.4s ease;z-index:1;}
.fu-note{
  margin-top:14px;
  padding:10px 14px;
  border-radius:10px;
  background:rgba(255,255,255,0.03);
  border:1px solid rgba(255,255,255,0.06);
  font-size:12px;
  font-weight:400;
  color:#848a94;
  line-height:1.6;
}
.fu-note b{color:#00d4a9;font-weight:700;}

/* ── Toggle (shared style for donut mode toggle + table mode toggle) ── */
.toggle-row{display:flex;justify-content:center;margin-top:10px;}
.tsB{
  display:inline-flex;
  gap:4px;
  padding:4px;
  border-radius:12px;
  background:rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.10);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  box-shadow:0 1px 0 rgba(255,255,255,0.06) inset,0 4px 16px rgba(0,0,0,0.3);
}
.tsB .t-btn{
  position:relative;
  padding:6px 18px;
  border:none;
  border-radius:8px;
  background:transparent;
  cursor:pointer;
  font-size:12px;
  font-weight:400;
  letter-spacing:0.04em;
  font-family:"PingFang SC", "SF Pro Display", -apple-system, "Helvetica Neue", sans-serif;
  color:#848a94;
  transition:color 0.2s ease,background 0.2s ease,box-shadow 0.2s ease;
  white-space:nowrap;
  outline:none;
}
.tsB .t-btn.active{
  color:#ebf9ff;
  background:linear-gradient(160deg,rgba(255,255,255,0.14) 0%,rgba(255,255,255,0.06) 100%);
  border:1px solid rgba(255,255,255,0.16);
  box-shadow:0 1px 0 rgba(255,255,255,0.12) inset,0 4px 12px rgba(0,0,0,0.25);
}
.tsB .t-btn:hover:not(.active){
  color:rgba(235,249,255,0.75);
  background:rgba(255,255,255,0.04);
}
.density-btn{
  display:inline-flex;
  align-items:center;
  padding:6px 14px;
}

/* ── Viz wrap ── */
.viz-wrap{
  display:flex;
  gap:16px;
  border-radius:16px;
  background:#0a0e13;
  border:1px solid rgba(255,255,255,0.06);
  padding:20px;
  margin-bottom:14px;
  align-items:flex-start;
}
.donut-col{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;margin-top:0;}
.donut-svg-wrap{position:relative;width:260px;height:260px;}
.donut-center{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:4px;
  pointer-events:none;padding:0 22px;text-align:center;
}
.donut-center-ticker{font-size:16px;font-weight:700;color:#ebf9ff;letter-spacing:0.01em;line-height:1.3;max-width:136px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;}
.donut-center-name{font-size:13px;font-weight:700;color:#848a94;letter-spacing:0.01em;line-height:1.3;max-width:136px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-all;}
.donut-center-val{font-size:24px;font-weight:700;letter-spacing:-0.01em;line-height:1;margin-top:2px;}
.bar-col{flex:1;display:flex;flex-direction:column;gap:0;min-width:0;justify-content:flex-start;}
.bar-viewport{height:270px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:#3a3850 #1a1828;}
.bar-viewport::-webkit-scrollbar{width:5px;}
.bar-viewport::-webkit-scrollbar-track{background:#1a1828;border-radius:3px;}
.bar-viewport::-webkit-scrollbar-thumb{background:#3a3850;border-radius:3px;}
.h-bar-row{display:grid;grid-template-columns:110px 1fr 70px;align-items:center;column-gap:8px;height:30px;padding:0 4px;border-radius:5px;cursor:default;transition:background 0.12s;}
.h-bar-row:hover{background:rgba(235,249,255,0.05);}
.h-bar-name{font-size:12px;font-weight:700;color:#848a94;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:right;}
.h-bar-track{position:relative;height:8px;background:rgba(255,255,255,0.07);border-radius:4px;overflow:hidden;}
.h-bar-fill{position:absolute;top:0;left:0;height:100%;border-radius:4px;transition:width 0.35s ease,background 0.35s ease;}
.h-bar-ret{font-size:12px;font-weight:700;text-align:right;white-space:nowrap;transition:color 0.2s;}

/* ── Table search box ── */
.table-search-wrap{position:relative;display:flex;align-items:center;flex:0 0 auto;}
.table-search-icon{position:absolute;left:9px;color:#848a94;pointer-events:none;display:flex;}
.table-search-input{
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.10);
  border-radius:8px;
  padding:6px 10px 6px 28px;
  font-size:12px;
  font-weight:400;
  font-family:"PingFang SC", "SF Pro Display", -apple-system, "Helvetica Neue", sans-serif;
  color:#ebf9ff;
  width:170px;
  outline:none;
  transition:border-color 0.15s,background 0.15s;
}
.table-search-input::placeholder{color:#848a94;}
.table-search-input:focus{border-color:rgba(255,255,255,0.24);background:rgba(255,255,255,0.08);}

/* ── Standalone stats panel (between search toolbar and holdings table) ── */
.stats-panel{
  display:flex;
  align-items:center;
  justify-content:flex-start;
  flex-wrap:wrap;
  gap:20px;
  min-width:0;
  padding:12px 14px;
  margin-top:12px;
  border-top:1px solid rgba(255,255,255,0.07);
  border-bottom:1px solid rgba(255,255,255,0.07);
  background:rgba(255,255,255,0.015);
  position:relative;
  z-index:1;
}
.stat-item{display:flex;align-items:baseline;gap:5px;white-space:nowrap;}
.stat-lbl{font-size:11px;font-weight:400;color:#848a94;letter-spacing:0.02em;}
.stat-val{font-size:13px;font-weight:700;color:#ebf9ff;}

/* ── Table (styleC column layout: Symbol / Weight / Quantity / Cost→Price / Change / Return-PnL) ── */
.table-wrap{
  position:relative;
  border-radius:16px;
  overflow:hidden;
  background:linear-gradient(160deg,rgba(255,255,255,0.028) 0%,rgba(255,255,255,0.012) 100%),rgba(10,12,16,0.92);
  border:1px solid rgba(255,255,255,0.08);
  box-shadow:0 1px 0 0 rgba(255,255,255,0.04) inset,0 8px 32px rgba(0,0,0,0.35);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
}
.table-wrap::before{
  content:'';
  position:absolute;
  inset:0;
  border-radius:16px;
  background:linear-gradient(180deg,rgba(255,255,255,0.045) 0%,transparent 40%);
  pointer-events:none;
  z-index:0;
}

/* ── Table toggle row (search + mode toggle) ── */
.table-toggle-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  padding:14px 14px 0;
  position:relative;
  z-index:1;
}

.pos-tbl{position:relative;z-index:1;}
.table-headrow,.table-row{
  display:grid;
  grid-template-columns:1.5fr 0.6fr 0.85fr 1.35fr 0.75fr 1.05fr;
  align-items:center;
  gap:10px;
  padding:8px 14px;
  font-variant-numeric:tabular-nums;
}
.table-headrow > div:not(:first-child),.table-row > div:not(:first-child){text-align:right;}
.table-headrow{
  font-size:12px;
  font-weight:400;
  color:#848a94;
  letter-spacing:0.06em;
  border-bottom:1px solid rgba(255,255,255,0.07);
  background:transparent;
}
.table-headrow > div.sortable{cursor:pointer;user-select:none;white-space:nowrap;transition:color 0.15s;}
.table-headrow > div.sortable:hover{color:#ebf9ff;}
.table-headrow > div.sort-asc,.table-headrow > div.sort-desc{color:#ebf9ff;}
.table-headrow > div .sort-icon::after{content:' ⇅';font-size:9px;opacity:0.35;}
.table-headrow > div.sort-asc .sort-icon::after{content:' ▲';font-size:9px;opacity:1;}
.table-headrow > div.sort-desc .sort-icon::after{content:' ▼';font-size:9px;opacity:1;}

.table-body .table-row{
  font-size:14px;
  font-weight:400;
  color:#ebf9ff;
  border-bottom:1px solid rgba(255,255,255,0.05);
  transition:background 0.12s;
}
.table-body .table-row:nth-child(even){background:rgba(255,255,255,0.015);}
.table-body .table-row:hover{background:rgba(255,255,255,0.03);}
.table-body .table-row:last-child{border-bottom:none;}
.table-body .table-empty{padding:24px 14px;text-align:center;font-size:13px;color:#848a94;}

.tbl-sym{font-size:14px;font-weight:400;}
.tbl-name{font-size:14px;color:#ebf9ff;font-weight:400;margin-left:7px;}

/* ── Compact (小) table mode ── */
.pos-tbl.compact .table-headrow{font-size:12px;}
.pos-tbl.compact .table-row{padding-top:4px;padding-bottom:4px;font-size:14px;line-height:1.15;}
.pos-tbl.compact .tbl-sym,.pos-tbl.compact .tbl-name{font-size:14px;}

/* ── styleC tint chips (Cost→Price / Change / Return-PnL cells) ── */
.tint-cell{display:flex;justify-content:flex-end;}
.tint-chip{display:inline-flex;align-items:center;justify-content:flex-end;width:100%;padding:6px 10px;border-radius:6px;font-variant-numeric:tabular-nums;font-weight:400;}

.cost-cell .tint-chip{gap:6px;background:transparent !important;padding:6px 0;}
.cost-cell .cost-val{color:#848a94;}
.cost-cell .arrow{font-size:11px;}
.cost-cell .price-val{font-weight:400;color:#ebf9ff;}

.chg-cell .tint-chip{gap:4px;font-weight:400;justify-content:center;background:transparent !important;padding:6px 0;}
.chg-cell .tri{font-size:9px;}

.pl-cell .tint-chip{gap:6px;font-weight:400;background:transparent !important;padding:6px 0;}
.pl-cell .pnl-val{font-weight:400;font-size:12px;opacity:0.8;}

/* ── Table Footer ── */
.table-footer{display:flex;justify-content:space-between;align-items:center;padding:10px 16px 10px;border-top:1px solid rgba(255,255,255,0.05);position:relative;z-index:1;}
.table-update-time{font-size:11px;font-weight:400;color:#848a94;letter-spacing:0.04em;}

/* ── Pagination ── */
.pagination{display:flex;align-items:center;justify-content:center;gap:6px;}
.pg-btn{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);color:#848a94;border-radius:7px;padding:5px 12px;font-size:12px;font-weight:400;cursor:pointer;transition:background 0.15s,color 0.15s,border-color 0.15s,box-shadow 0.15s;font-family:"PingFang SC", "SF Pro Display", -apple-system, "Helvetica Neue", sans-serif;}
.pg-btn:hover:not(:disabled){background:rgba(255,255,255,0.08);color:#ebf9ff;border-color:rgba(255,255,255,0.18);}
.pg-btn:disabled{opacity:0.3;cursor:not-allowed;}
.pg-btn.active{
  color:#ebf9ff;
  background:linear-gradient(160deg,rgba(255,255,255,0.14) 0%,rgba(255,255,255,0.06) 100%);
  border:1px solid rgba(255,255,255,0.16);
  box-shadow:0 1px 0 rgba(255,255,255,0.12) inset,0 4px 12px rgba(0,0,0,0.25);
}
.pg-info{font-size:11px;font-weight:400;color:#848a94;letter-spacing:0.05em;margin:0 6px;}

/* ── Tooltip ── */
#tt{position:fixed;z-index:999;pointer-events:none;display:none;background:rgba(10,14,19,0.97);border:1px solid rgba(255,255,255,0.08);border-radius:10px;padding:10px 14px;min-width:170px;box-shadow:0 8px 32px rgba(0,0,0,0.6);font-size:12px;line-height:1.9;font-weight:400;}

/* ══════════════════════════════════
   RWD — Mobile / Tablet
══════════════════════════════════ */
@media (max-width:700px){
  body{padding:16px 12px;}

  /* Fund usage bar */
  .fund-usage-card{padding:14px 16px;}
  .fu-value{font-size:20px;}

  /* Viz block: stack vertically */
  .viz-wrap{
    flex-direction:column;
    padding:14px 12px;
    gap:12px;
  }
  .donut-col{
    width:100%;
    flex-direction:row;
    align-items:center;
    margin-top:0;
    gap:12px;
  }
  .donut-svg-wrap{width:160px;height:160px;flex-shrink:0;}
  #donutSvg{width:160px;height:160px;}

  /* Scale SVG viewBox via transform */
  .donut-center-val{font-size:16px;}
  .donut-center-ticker{font-size:13px;}
  .donut-center-name{font-size:12px;}
  .toggle-row{margin-top:6px;justify-content:flex-start;}

  /* Bar list */
  .bar-col{width:100%;}
  .bar-viewport{height:180px;}
  .h-bar-row{grid-template-columns:90px 1fr 60px;}
  .h-bar-name{font-size:11px;}
  .h-bar-ret{font-size:11px;}

  /* Table toggle row */
  .table-toggle-row{padding:12px 10px 0;flex-wrap:wrap;gap:8px;}
  .table-search-input{width:130px;}
  .stats-panel{gap:12px;padding:10px 10px;overflow-x:auto;flex-wrap:nowrap;}
  .stat-lbl{font-size:10px;}
  .stat-val{font-size:12px;}

  /* Table: horizontal scroll */
  .table-wrap{border-radius:12px;overflow-x:auto;-webkit-overflow-scrolling:touch;}
  .table-headrow,.table-row{min-width:560px;padding:10px 10px 8px;}
  .table-headrow{font-size:11px;}
  .table-body .table-row{padding:9px 10px;font-size:13px;}
  .pos-tbl.compact .table-headrow{font-size:12px;}
  .pos-tbl.compact .table-row{padding:4px 10px;font-size:14px;line-height:1.15;}

  /* Table footer */
  .table-footer{flex-direction:column;gap:8px;align-items:flex-start;}
  .pagination{flex-wrap:wrap;}
  .pg-btn{padding:4px 10px;font-size:11px;}

  /* Hide tooltip on touch */
  #tt{display:none !important;}
}

@media (max-width:400px){
  .donut-col{flex-direction:column;align-items:center;}
  .donut-svg-wrap{width:180px;height:180px;}
  #donutSvg{width:180px;height:180px;}
}
</style>
</head>
<body>
<div class="wrap">

  <!-- Fund usage bar -->
  <div class="fund-usage-card">
    <div class="fu-value" id="fu-value"></div>
    <div class="fu-track" id="fu-track">
      <div class="fu-fill" id="fu-fill"></div>
      <div class="fu-hatch" id="fu-hatch"></div>
      <div class="fu-handle" id="fu-handle"></div>
    </div>
    <div class="fu-note" id="fu-note"></div>
  </div>

  <!-- Viz -->
  <div class="viz-wrap">
    <div class="donut-col">
      <div class="donut-svg-wrap">
        <svg id="donutSvg" width="260" height="260" viewBox="0 0 260 260">
          <defs>
            <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
              <feGaussianBlur stdDeviation="4" result="blur"/>
              <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
            </filter>
          </defs>
          <circle cx="130" cy="130" r="100" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="20"/>
          <circle cx="130" cy="130" r="110.5" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="0.5"/>
          <circle cx="130" cy="130" r="89.5"  fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="0.5"/>
          <g id="donutGlowG"></g>
          <g id="donutMainG"></g>
          <g id="donutHlG"></g>
          <circle cx="130" cy="130" r="82" fill="#0a0e13"/>
          <circle cx="130" cy="130" r="82" fill="none" stroke="rgba(101,102,252,0.14)" stroke-width="1.5"/>
          <circle cx="130" cy="130" r="78" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="0.5"/>
        </svg>
        <div class="donut-center">
          <div class="donut-center-ticker" id="cTicker"></div>
          <div class="donut-center-name"   id="cName"></div>
          <div class="donut-center-val"    id="cVal"></div>
        </div>
      </div>
      <div class="toggle-row">
        <div class="tsB">
          <button class="t-btn active" id="btnUR">PnL</button>
          <button class="t-btn"        id="btnRC">Today</button>
        </div>
      </div>
    </div>
    <div class="bar-col">
      <div class="bar-viewport" id="barViewport">
        <div id="barList"></div>
      </div>
    </div>
  </div>

  <div class="table-wrap">
    <div class="table-toggle-row">
      <div class="table-search-wrap">
        <svg class="table-search-icon" width="13" height="13" viewBox="0 0 13 13" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="5.5" cy="5.5" r="4.3" stroke="currentColor" stroke-width="1.3"/>
          <line x1="8.6" y1="8.6" x2="12" y2="12" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
        </svg>
        <input type="text" id="tableSearch" class="table-search-input" placeholder="Search" autocomplete="off">
      </div>
      <div class="tsB densityB">
        <button class="t-btn density-btn active" id="btnCompact" title="-">
          <span>-</span>
        </button>
        <button class="t-btn density-btn" id="btnFull" title="+">
          <span>+</span>
        </button>
      </div>
    </div>
    <div class="stats-panel" id="tableStats">
      <div class="stat-item"><span class="stat-lbl">Unrealized PnL</span><span class="stat-val" id="st-ret"></span></div>
      <div class="stat-item"><span class="stat-lbl">Win Rate</span><span class="stat-val" id="st-winrate"></span></div>
      <div class="stat-item"><span class="stat-lbl">Market Value</span><span class="stat-val" id="st-mv"></span></div>
      <div class="stat-item"><span class="stat-lbl">Cost</span><span class="stat-val" id="st-cost"></span></div>
    </div>
    <div class="pos-tbl compact" id="posTable"></div>
    <div class="table-footer">
      <div class="pagination" id="pagination"></div>
      <div class="table-update-time" id="tbl-update-time" style="margin-left:auto;"></div>
    </div>
  </div>
</div>

var CHART_UP_HEX   = '#fb4d69';
var CHART_DOWN_HEX = '#00d4a9';

var GAP=2.8,CX=130,CY=130,R=100,INNER=82;
var totalW = HOLDINGS_DATA.total_weight;
var H      = HOLDINGS_DATA;

var mode = 'ret';

/* ── Table mode / pagination / search ── */
var tableMode        = 'compact';
var PAGE_SIZE_FULL    = 13;
var PAGE_SIZE_COMPACT = 19;
function pageSize(){ return tableMode==='compact' ? PAGE_SIZE_COMPACT : PAGE_SIZE_FULL; }

var currentPage  = 1;
var sortKey      = null;
var sortDir      = 1;
var searchQuery  = '';
var tableRecords = H.records.slice();

function getFilteredRecords(){
  if(!searchQuery) return tableRecords;
  return tableRecords.filter(function(r){
    return r.ticker.toLowerCase().indexOf(searchQuery)>-1 || r.name.toLowerCase().indexOf(searchQuery)>-1;
  });
}

/* ── helpers ── */
function polar(cx,cy,r,deg){
  var a=(deg-90)*Math.PI/180;
  return [cx+r*Math.cos(a), cy+r*Math.sin(a)];
}
function arcPath(cx,cy,R,ri,s,e){
  var p1=polar(cx,cy,R,s),  p2=polar(cx,cy,R,e);
  var p3=polar(cx,cy,ri,e), p4=polar(cx,cy,ri,s);
  var lg=e-s>180?1:0;
  return 'M'+p1[0]+','+p1[1]+' A'+R+','+R+' 0 '+lg+',1 '+p2[0]+','+p2[1]+
         ' L'+p3[0]+','+p3[1]+' A'+ri+','+ri+' 0 '+lg+',0 '+p4[0]+','+p4[1]+'Z';
}
function retColor(val){
  var allVals=H.records.map(function(r){ return mode==='ret'?Math.abs(r.ret):Math.abs(r.change_rate); });
  var maxAbs=Math.max.apply(null,allVals.concat([0.01]));
  var norm=Math.min(Math.abs(val)/maxAbs,1);
  var a=0.08+0.92*Math.pow(norm,0.6);
  var ah=Math.round(a*255).toString(16).padStart(2,'0');
  var baseHex=val>=0?CHART_UP_HEX.slice(1):CHART_DOWN_HEX.slice(1);
  return '#'+baseHex+ah;
}
function retHex(v){ return v>=0?CHART_UP_HEX:CHART_DOWN_HEX; }
function fmtSign(v,dec){ dec=dec===undefined?2:dec; return (v>=0?'+':'')+v.toFixed(dec)+'%'; }
function getVal(rec){ return mode==='ret'?rec.ret:rec.change_rate; }

/* ── Fund Usage Bar ── */
function fuBarColor(npc){ return npc>0?CHART_UP_HEX:CHART_DOWN_HEX; }

var fuSolidEnd=0, fuHatchEnd=0, fuCurPct=0, fuNetPct=0, fuCashPct=0;

function initFundUsage(){
  var mv=H.market_value, bal=H.total_balance, cash=H.cash, npc=H.net_position_change;
  var curPct  = bal>0?Math.min(Math.max(mv/bal*100,0),100):0;
  var netPct  = bal>0?(npc/bal*100):0;
  var prevPct = Math.min(Math.max(curPct-netPct,0),100);
  var cashPct = bal>0?(cash/bal*100):0;
  var barColor= fuBarColor(npc);

  var solidEnd,hatchEnd,handlePos=curPct;
  if(npc>=0){ solidEnd=prevPct; hatchEnd=curPct; }
  else       { solidEnd=curPct; hatchEnd=prevPct; }
  fuSolidEnd=solidEnd; fuHatchEnd=hatchEnd; fuCurPct=curPct; fuNetPct=netPct; fuCashPct=cashPct;

  document.getElementById('fu-value').innerHTML=
    'NT$ '+mv.toLocaleString()+'<span class="fu-sep"> / </span><span class="fu-total">'+bal.toLocaleString()+'</span>';

  var npcColor=npc===0?'#848a94':barColor;
  var npcText=npc===0?'0':(npc>0?'+':'-')+Math.abs(npc).toLocaleString();

  var fillEl=document.getElementById('fu-fill');
  fillEl.style.width=solidEnd+'%';
  fillEl.style.background=barColor;

  var hatchEl=document.getElementById('fu-hatch');
  hatchEl.style.left=solidEnd+'%';
  hatchEl.style.width=Math.max(hatchEnd-solidEnd,0)+'%';
  hatchEl.style.background='repeating-linear-gradient(45deg,'+barColor+'b3 0px,'+barColor+'b3 2px,transparent 2px,transparent 6px)';

  var handleEl=document.getElementById('fu-handle');
  handleEl.style.left=handlePos+'%';
  handleEl.style.borderColor=barColor;

  document.getElementById('fu-note').innerHTML=
    'Used <b>'+curPct.toFixed(0)+'%</b>，Net Position Change <b style="color:'+npcColor+';">'+npcText+'</b>，Cash <b style="color:#ebf9ff;">NT$ '+cash.toLocaleString()+'</b>';

  var track=document.getElementById('fu-track');
  track.addEventListener('mousemove',  showFuTt);
  track.addEventListener('mouseleave', hideTt);
}
function showFuTt(e){
  var rect=e.currentTarget.getBoundingClientRect();
  var relX=Math.min(Math.max((e.clientX-rect.left)/rect.width*100,0),100);
  var barColor=fuBarColor(H.net_position_change);
  var label,valText,valColor;
  if(relX<fuSolidEnd){
    label='Used'; valText=fuCurPct.toFixed(1)+'%'; valColor=barColor;
  } else if(relX<fuHatchEnd){
    label='Net Position Change'; valText=(fuNetPct>=0?'+':'')+fuNetPct.toFixed(1)+'%'; valColor=barColor;
  } else {
    label='Cash %'; valText=fuCashPct.toFixed(1)+'%'; valColor='#848a94';
  }
  tt.innerHTML='<div>'+label+': <b style="color:'+valColor+';font-weight:400;">'+valText+'</b></div>';
  tt.style.display='block';
  moveTt(e);
}

/* ── Table toolbar stats ── */
function initTableStats(){
  var retEl=document.getElementById('st-ret');
  var pnlText=(H.total_pnl>=0?'+':'')+H.total_pnl.toLocaleString();
  retEl.textContent=fmtSign(H.unrealized_ret)+' ('+pnlText+')';
  retEl.style.color=retHex(H.total_pnl);

  var wrEl=document.getElementById('st-winrate');
  wrEl.textContent=H.win_rate+'% ('+H.winning+'/'+H.holding_count+')';
  wrEl.style.color=H.win_rate>=50?CHART_UP_HEX:CHART_DOWN_HEX;

  document.getElementById('st-mv').textContent='NT$ '+H.market_value.toLocaleString();
  document.getElementById('st-cost').textContent='NT$ '+H.total_cost.toLocaleString();
}

/* ── Donut ── */
var cTicker=document.getElementById('cTicker');
var cName  =document.getElementById('cName');
var cVal   =document.getElementById('cVal');
var glowG  =document.getElementById('donutGlowG');
var mainG  =document.getElementById('donutMainG');
var hlG    =document.getElementById('donutHlG');
var svgPaths={};
var barRows={};

function resetCenter(){
  cTicker.textContent=''; cTicker.style.display='none';
  if(mode==='ret'){
    cName.textContent='PnL';
    cVal.textContent=fmtSign(H.unrealized_ret);
    cVal.style.color=retHex(H.unrealized_ret);
  } else {
    cName.textContent='Today';
    cVal.textContent=fmtSign(H.realtime_change);
    cVal.style.color=retHex(H.realtime_change);
  }
  cName.style.color='rgba(132,138,148,0.85)';
}
function setCenter(rec){
  cTicker.style.display='block'; cTicker.textContent=rec.ticker;
  cName.textContent=rec.name; cName.style.color='rgba(132,138,148,0.85)';
  var v=getVal(rec);
  cVal.textContent=fmtSign(v); cVal.style.color=retHex(v);
}

function buildDonut(){
  glowG.innerHTML=''; mainG.innerHTML=''; hlG.innerHTML='';
  var angle=-90;
  H.records.forEach(function(rec){
    var sweep=totalW>0?(rec.weight/totalW)*360-GAP:0;
    if(sweep<=0){ angle+=totalW>0?(rec.weight/totalW)*360:0; return; }
    var s=angle+GAP/2, e=s+sweep;
    angle+=sweep+GAP;
    var v=getVal(rec);
    var color=retColor(v);
    var baseHex=v>=0?CHART_UP_HEX:CHART_DOWN_HEX;
    var lg=sweep>180?1:0;

    var glow=document.createElementNS('http://www.w3.org/2000/svg','path');
    glow.setAttribute('d',arcPath(CX,CY,R,INNER,s,e));
    glow.setAttribute('fill',baseHex);
    glow.setAttribute('opacity','0.18');
    glow.setAttribute('filter','url(#glow)');
    glow.setAttribute('pointer-events','none');
    glowG.appendChild(glow);

    var main=document.createElementNS('http://www.w3.org/2000/svg','path');
    main.setAttribute('d',arcPath(CX,CY,R,INNER,s,e));
    main.setAttribute('fill',color);
    main.setAttribute('opacity','0.92');
    main.style.cssText='cursor:pointer;transition:opacity 0.15s,filter 0.15s;';
    (function(r,m){
      m.addEventListener('mouseenter',function(ev){
        setCenter(r); m.style.filter='brightness(1.35)';
        if(barRows[r.label]) barRows[r.label].style.background='rgba(235,249,255,0.06)';
        showTt(r,ev);
      });
      m.addEventListener('mousemove',function(ev){ moveTt(ev); });
      m.addEventListener('mouseleave',function(){
        resetCenter(); m.style.filter='';
        if(barRows[r.label]) barRows[r.label].style.background='';
        hideTt();
      });
    })(rec,main);
    mainG.appendChild(main);
    svgPaths[rec.label]=main;

    var hx1=polar(CX,CY,R,s)[0], hy1=polar(CX,CY,R,s)[1];
    var hx2=polar(CX,CY,R,e)[0], hy2=polar(CX,CY,R,e)[1];
    var hl=document.createElementNS('http://www.w3.org/2000/svg','path');
    hl.setAttribute('d','M'+hx1+','+hy1+' A'+R+','+R+' 0 '+lg+',1 '+hx2+','+hy2);
    hl.setAttribute('fill','none');
    hl.setAttribute('stroke','rgba(255,255,255,0.28)');
    hl.setAttribute('stroke-width','1.2');
    hl.setAttribute('pointer-events','none');
    hlG.appendChild(hl);
  });
}

function buildBars(){
  var barListEl=document.getElementById('barList');
  barListEl.innerHTML='';
  Object.keys(barRows).forEach(function(k){ delete barRows[k]; });
  var sortedRecs=mode==='ret'?SORTED_RECORDS:SORTED_RECORDS_CR;
  var absVals=sortedRecs.map(function(r){ return Math.abs(getVal(r)); });
  var maxAbsVal=Math.max.apply(null,absVals.concat([0.01]));
  sortedRecs.forEach(function(rec){
    var v=getVal(rec);
    var rc=retHex(v), rs=fmtSign(v);
    var fp=(Math.abs(v)/maxAbsVal*100).toFixed(1);
    var row=document.createElement('div');
    row.className='h-bar-row';
    row.innerHTML='<div class="h-bar-name" title="'+rec.ticker+' '+rec.name+'">'+rec.ticker+' '+rec.name+'</div>'
      +'<div class="h-bar-track"><div class="h-bar-fill" style="width:'+fp+'%;background:'+retColor(v)+';"></div></div>'
      +'<div class="h-bar-ret" style="color:'+rc+';">'+rs+'</div>';
    (function(r,rw){
      rw.addEventListener('mouseenter',function(ev){
        setCenter(r);
        if(svgPaths[r.label]) svgPaths[r.label].style.filter='brightness(1.35)';
        showTt(r,ev);
      });
      rw.addEventListener('mousemove',function(ev){ moveTt(ev); });
      rw.addEventListener('mouseleave',function(){
        resetCenter();
        if(svgPaths[r.label]) svgPaths[r.label].style.filter='';
        hideTt();
      });
    })(rec,row);
    barListEl.appendChild(row);
    barRows[rec.label]=row;
  });
  document.getElementById('barViewport').style.overflowY=sortedRecs.length<=9?'hidden':'auto';
}

function updateMode(newMode){
  mode=newMode;
  document.getElementById('btnUR').classList.toggle('active',mode==='ret');
  document.getElementById('btnRC').classList.toggle('active',mode==='change_rate');
  buildDonut(); buildBars(); resetCenter();
}
document.getElementById('btnUR').addEventListener('click',function(){ updateMode('ret'); });
document.getElementById('btnRC').addEventListener('click',function(){ updateMode('change_rate'); });

/* ── Table mode toggle (小 / 大) ── */
function setTableMode(newTableMode){
  tableMode=newTableMode;
  document.getElementById('btnFull').classList.toggle('active',tableMode==='full');
  document.getElementById('btnCompact').classList.toggle('active',tableMode==='compact');
  document.getElementById('posTable').classList.toggle('compact',tableMode==='compact');
  currentPage=1;
  renderTable(); renderPagination();
}
document.getElementById('btnFull').addEventListener('click',function(){ setTableMode('full'); });
document.getElementById('btnCompact').addEventListener('click',function(){ setTableMode('compact'); });

/* ── Table search ── */
document.getElementById('tableSearch').addEventListener('input',function(e){
  searchQuery=e.target.value.trim().toLowerCase();
  currentPage=1;
  renderTable(); renderPagination();
});

/* ── Table (styleC column layout) ── */
var cols=[
  {key:'ticker_name', label:'Symbol',           sortable:false},
  {key:'weight',      label:'Weight',           sortable:true},
  {key:'quantity',    label:'Quantity',         sortable:true},
  {key:'last_price',  label:'Cost → Price', sortable:true},
  {key:'change_rate', label:'Change',           sortable:true},
  {key:'ret',         label:'Return / PnL',     sortable:true},
];

function sortRecords(key){
  if(sortKey===key){ sortDir*=-1; } else { sortKey=key; sortDir=1; }
  tableRecords=H.records.slice().sort(function(a,b){
    var av=a[key]!==undefined?a[key]:0;
    var bv=b[key]!==undefined?b[key]:0;
    return (av<bv?-1:av>bv?1:0)*sortDir;
  });
  currentPage=1;
  renderTable(); renderPagination();
}

function tri(v){ return v>0?'▲':(v<0?'▼':''); }

function chgChip(cr){
  var col=retHex(cr);
  return '<span class="tint-chip" style="color:'+col+';"><span class="tri">'+tri(cr)+'</span>'+fmtSign(cr)+'</span>';
}

function costPriceChip(avg,last,ret){
  var col=retHex(ret);
  return '<span class="tint-chip"><span class="cost-val">'+avg.toFixed(2)+'</span><span class="arrow" style="color:'+col+';">→</span><span class="price-val">'+last.toFixed(2)+'</span></span>';
}

function retPnlChip(ret,pnl){
  var col=retHex(ret);
  return '<span class="tint-chip" style="color:'+col+';">'+fmtSign(ret)+'<span class="pnl-sep" style="color:#848a94;"> / </span><span class="pnl-val">'+(pnl>=0?'+':'')+pnl.toLocaleString()+'</span></span>';
}

function symbolCellHtml(r){
  return '<div><span class="tbl-sym">'+r.ticker+'</span><span class="tbl-name">'+r.name+'</span></div>';
}

function renderHeadRow(){
  var head=document.createElement('div');
  head.className='table-headrow';
  cols.forEach(function(c){
    var div=document.createElement('div');
    div.innerHTML=c.label+(c.sortable?'<span class="sort-icon"></span>':'');
    if(c.sortable){
      div.classList.add('sortable');
      if(sortKey===c.key) div.classList.add(sortDir===1?'sort-asc':'sort-desc');
      (function(k){ div.addEventListener('click',function(){ sortRecords(k); }); })(c.key);
    }
    head.appendChild(div);
  });
  return head;
}

function renderRow(r){
  var row=document.createElement('div');
  row.className='table-row';
  row.dataset.ticker=r.ticker;
  row.innerHTML=
    symbolCellHtml(r)
    +'<div>'+r.weight.toFixed(1)+'%</div>'
    +'<div>'+r.quantity.toLocaleString()+'</div>'
    +'<div class="cost-cell tint-cell">'+costPriceChip(r.price,r.last_price,r.ret)+'</div>'
    +'<div class="chg-cell tint-cell">'+chgChip(r.change_rate)+'</div>'
    +'<div class="pl-cell tint-cell">'+retPnlChip(r.ret,r.pnl)+'</div>';
  return row;
}

function renderTable(){
  var container=document.getElementById('posTable');
  container.innerHTML='';
  container.appendChild(renderHeadRow());
  var body=document.createElement('div');
  body.className='table-body';
  var ps=pageSize();
  var filtered=getFilteredRecords();
  var start=(currentPage-1)*ps;
  var pageRecs=filtered.slice(start,start+ps);
  if(pageRecs.length===0){
    var empty=document.createElement('div');
    empty.className='table-empty';
    empty.textContent='找不到符合的持股';
    body.appendChild(empty);
  } else {
    pageRecs.forEach(function(r){ body.appendChild(renderRow(r)); });
  }
  container.appendChild(body);
}

function renderPagination(){
  var pg=document.getElementById('pagination');
  pg.innerHTML='';
  var ps=pageSize();
  var filtered=getFilteredRecords();
  var total=filtered.length;
  if(total<=ps){ pg.style.display='none'; return; }
  pg.style.display='flex';
  var totalPages=Math.ceil(total/ps);

  var prev=document.createElement('button');
  prev.className='pg-btn'; prev.textContent='‹'; prev.disabled=currentPage===1;
  prev.addEventListener('click',function(){ currentPage--; renderTable(); renderPagination(); });
  pg.appendChild(prev);

  var range=getPgRange(currentPage,totalPages);
  var lastPg=0;
  range.forEach(function(p){
    if(p-lastPg>1){
      var el=document.createElement('span');
      el.className='pg-info'; el.textContent='…';
      pg.appendChild(el);
    }
    var btn=document.createElement('button');
    btn.className='pg-btn'+(p===currentPage?' active':'');
    btn.textContent=p;
    (function(pg2){ btn.addEventListener('click',function(){ currentPage=pg2; renderTable(); renderPagination(); }); })(p);
    pg.appendChild(btn);
    lastPg=p;
  });

  var next=document.createElement('button');
  next.className='pg-btn'; next.textContent='›'; next.disabled=currentPage===totalPages;
  next.addEventListener('click',function(){ currentPage++; renderTable(); renderPagination(); });
  pg.appendChild(next);

  var info=document.createElement('span');
  info.className='pg-info';
  var s=(currentPage-1)*ps+1;
  var e=Math.min(currentPage*ps,total);
  info.textContent=s+'–'+e+' / '+total;
  pg.appendChild(info);
}

function getPgRange(cur,total){
  if(total<=7) return Array.from({length:total},function(_,i){ return i+1; });
  var s=new Set([1,total,cur]);
  if(cur>1) s.add(cur-1);
  if(cur<total) s.add(cur+1);
  return [...s].sort(function(a,b){ return a-b; });
}

/* ── Tooltip ── */
var tt=document.getElementById('tt');
function showTt(r,e){
  var rc=retHex(r.ret), pc=retHex(r.pnl), cc=retHex(r.change_rate);
  tt.innerHTML=
    '<div style="font-weight:400;font-size:13px;">'+r.ticker+'</div>'
    +'<div style="color:#848a94;font-weight:400;font-size:12px;margin-bottom:6px;">'+r.name+'</div>'
    +'<div>Weight: <b style="font-weight:400;">'+r.weight.toFixed(2)+'%</b></div>'
    +'<div>Return: <b style="color:'+rc+';font-weight:400;">'+fmtSign(r.ret)+'</b></div>'
    +'<div>PnL: <b style="color:'+pc+';font-weight:400;">'+(r.pnl>=0?'+':'')+r.pnl.toLocaleString()+'</b></div>'
    +'<div>Change: <b style="color:'+cc+';font-weight:400;">'+fmtSign(r.change_rate)+'</b></div>';
  tt.style.display='block';
  moveTt(e);
}
function moveTt(e){
  var tw=tt.offsetWidth||170, th=tt.offsetHeight||100;
  var x=e.clientX+14, y=e.clientY-10;
  if(x+tw>window.innerWidth-8)  x=e.clientX-tw-10;
  if(y+th>window.innerHeight-8) y=window.innerHeight-th-8;
  tt.style.left=x+'px'; tt.style.top=y+'px';
}
function hideTt(){ tt.style.display='none'; }

/* ── Initial render ── */
initFundUsage();
initTableStats();
buildDonut(); buildBars(); resetCenter();
renderTable(); renderPagination();
</script>
